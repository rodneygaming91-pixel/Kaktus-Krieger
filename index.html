</head><body><title>Kaktus-Krieger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: ein Handy-Hochformat-Spielfeld, mittig, HUD oben, Kampf-Canvas, Infozeile unten. Bewusst nur ein (dunkles Wüstennacht-)Thema. */
:root{
  --night:#1c140f;      /* Hintergrund: dunkler Stein */
  --dusk:#3a2c22;       /* Flächen: Stein */
  --frame:#6b5644;      /* Rahmen */
  --frameD:#221812;     /* Rahmen innen */
  --sand:#f0b866;       /* Münzen, Hervorhebung */
  --cactus:#63c74d;     /* Leben, Spielfigur */
  --bloom:#ff6fae;      /* Akzent, Boss */
  --text:#f4e6cc;
  --muted:#b8a488;
  --display:"Lilita One","Arial Black",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
html.fixhome,html.fixhome body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--night);color:var(--text);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;box-sizing:border-box;display:flex;justify-content:center;align-items:flex-start;overflow-x:hidden;overflow-y:auto;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.game{width:100%;max-width:520px;display:flex;flex-direction:column;gap:10px;min-height:0}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:1.6rem;margin:0;letter-spacing:.02em;color:var(--cactus);line-height:1}
h1 span{color:var(--bloom)}
.res{display:flex;gap:8px}
.chip{background:var(--dusk);border-radius:999px;padding:6px 12px;font-weight:800;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px;font-size:.95rem}
.chip i{width:12px;height:12px;border-radius:50%;background:var(--sand);box-shadow:inset -2px -2px 0 rgba(0,0,0,.25)}
.stage{display:flex;flex-direction:column;gap:6px}
.stage-top{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.stage-top b{font-family:var(--display);font-weight:400;font-size:1.15rem;letter-spacing:.03em}
.stage-top small{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.bar{height:10px;background:var(--dusk);border-radius:6px;overflow:hidden}
.bar>div{height:100%;width:0;background:var(--sand);transition:width .2s}
.bar.boss>div{background:var(--bloom)}
#cv{width:100%;aspect-ratio:480/300;max-width:100%;border-radius:14px;display:block;background:#241540;image-rendering:auto}
.foot{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;gap:12px;flex-wrap:wrap}
.foot b{color:var(--text);font-variant-numeric:tabular-nums}
.capsule{display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:14px;padding:14px 18px;
  background:var(--cactus);color:var(--night);font-family:var(--display);font-size:1.25rem;letter-spacing:.03em;cursor:pointer;
  box-shadow:0 4px 0 #3e8a2f;transition:transform .08s}
.capsule:active{transform:translateY(3px);box-shadow:0 1px 0 #3e8a2f}
.capsule:disabled{background:var(--dusk);color:var(--muted);box-shadow:0 4px 0 #120b24;cursor:default}
.capsule:focus-visible,.btn:focus-visible{outline:3px solid var(--sand);outline-offset:2px}
.capsule .n{background:var(--night);color:var(--sand);border-radius:999px;padding:2px 10px;font-family:var(--body);font-weight:800;font-size:.95rem}
.actions{display:flex;gap:8px}
.actions{display:grid;grid-template-columns:repeat(3,1fr)}
.actions .garden{min-width:0;padding:7px 6px}
.hqmap{width:100%;aspect-ratio:320/200;max-width:100%;border-radius:8px;border:3px solid #6b5644;box-shadow:inset 0 0 0 2px #221812;display:block}
.wsbank{display:flex;justify-content:space-between;gap:8px;background:var(--night);border:2px solid #6b5644;border-radius:8px;padding:6px 10px;font-weight:800;font-variant-numeric:tabular-nums}
.wsbank b{color:#ffd447}.wsbank span:first-child b{color:#7fe08a}.wsbank i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;background:radial-gradient(circle at 35% 35%,#fff2a8,#e0a800 55%,#8a6200);border:1.5px solid #5a3e00;vertical-align:-1px}
.wsb{display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:86px}.wsb small{font-size:.68rem;color:inherit;opacity:.9}
.chip.kak{color:#7fe08a}.chip.kak b{font-size:.85rem}
.ktcard{display:grid;grid-template-columns:84px 1fr;grid-template-rows:auto auto;gap:4px 10px;align-items:center;background:var(--night);border:2px solid var(--rc);border-radius:12px;padding:6px 8px;margin-bottom:8px;box-shadow:inset 0 0 14px #0009}
.ktpv{grid-row:1/3;width:84px;height:84px;border-radius:10px;background:radial-gradient(circle at 50% 60%,#ffffff18,#0000 70%)}
.ktinfo{display:flex;flex-direction:column;gap:2px;min-width:0}.ktinfo b{font-size:1rem}.ktpro{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:.7rem}.ktpro em{font-style:normal;font-weight:700}
.ktpro em.up{color:#7fe08a}.ktpro em.down{color:#ff8a7a}.ktbtn{justify-self:stretch;padding:6px 8px;font-size:.9rem}.ktbtn small{font-size:.72rem;margin-left:6px;opacity:.85}
.ktgrid{grid-template-columns:repeat(4,1fr)!important}.skbig .ktbig{width:76px;height:76px}.skdet .ktpro{justify-content:center;margin:2px 0 4px}
.ktbtns{display:flex;gap:6px}.ktbtns .ktbtn{flex:1;white-space:nowrap;font-size:.78rem;padding:7px 4px}.ktbtns .ktbtn small{margin-left:3px}
.ovw{display:flex;flex-direction:column;gap:8px}.ovw h2{margin:0;text-align:center}
.ovtop{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ovpic{position:relative;border:3px solid var(--rc);border-radius:12px;background:radial-gradient(circle at 50% 55%,#4a3a5a,#1c1424);display:flex;flex-direction:column;align-items:center;padding:4px}
.ovpic canvas{width:100%;max-width:150px;aspect-ratio:1}.ovpic b{font-size:.9rem}.ovr{position:absolute;top:4px;left:7px;font-weight:900;font-size:.72rem}
.ovpic.sm{padding:2px;font:inherit;color:#fff;cursor:pointer}.ovpic.sm em{font-style:normal;font-size:.58rem;font-weight:900;color:#7fe08a;margin-top:-4px}.ovpic.sm.up{box-shadow:0 0 10px #7fe08a}.ovpic.sm canvas{width:74px}
.ovgears{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;align-content:center}
.ovgear{aspect-ratio:1;border:2px solid var(--rc);border-radius:8px;background:#241a14;display:grid;place-items:center;overflow:hidden}
.ovgear canvas{width:100%;height:100%}.ovgear i{font-style:normal;font-size:.5rem;color:var(--muted);text-align:center}
.ovlv{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;font-weight:900}.ovlv span{color:#ffd447}
.ovstats{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;background:#0005;border:2px solid #6b5644;border-radius:10px;padding:6px 9px}
.ovstats div{display:flex;justify-content:space-between;gap:6px;font-size:.74rem;border-bottom:1px solid #ffffff10;padding:2px 0}
.ovstats span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ovstats span i{font-style:normal;display:inline-block;width:16px}.ovstats b{font-variant-numeric:tabular-nums;white-space:nowrap}
.ovhead{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}.ovname{display:flex;flex-direction:column;gap:1px}.ovname b{font-size:1.1rem}.ovname small{font-size:.74rem;color:var(--muted)}
.ovsec{background:#0005;border:2px solid #6b5644;border-radius:10px;padding:5px 7px;display:flex;flex-direction:column;gap:4px}.ovsec>b{font-size:.8rem;color:#ffd447}
.osolo{display:flex;align-items:center;gap:10px;justify-content:space-between}.osolo b{font-size:1rem}
.ovbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px}.ovbtns .btn{font-size:.82rem;padding:8px 4px;white-space:nowrap}
.ovsec.soon{flex-direction:row;justify-content:space-between;opacity:.55}.ovsec.soon small{color:var(--sand);font-weight:800}
.ovrow{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.ovrow.g5{grid-template-columns:repeat(5,1fr);padding:0 6%}.ovrow.g9{grid-template-columns:repeat(9,1fr);gap:3px}
.ovico{position:relative;aspect-ratio:1;border:2px solid var(--rc);border-radius:8px;background:#241a14;display:grid;place-items:center}
.ovico i{font-style:normal;font-size:1.2rem;color:var(--ic)}.ovico canvas{width:90%;height:90%}.ovico span{position:absolute;bottom:-1px;left:0;right:0;text-align:center;font-size:.5rem;font-weight:900;text-shadow:0 1px 0 #000}
.ovico.empty{--rc:#4a3a2c;opacity:.5}
.gart2{gap:8px}
.ghero{position:relative;border:3px solid #6b5644;border-radius:14px;overflow:hidden;box-shadow:0 4px 0 #0006}
.ghero canvas{display:block;width:100%;height:auto}
.gtag{position:absolute;left:10px;top:7px;text-align:left;display:flex;flex-direction:column;text-shadow:0 2px 0 #0008}.gtag b{font-family:'Lilita One','Arial Black',sans-serif;font-size:1.2rem;color:#fff}.gtag small{font-size:.64rem;color:#fff;font-weight:800;max-width:9.5em;line-height:1.15}
.gbest{position:absolute;right:8px;bottom:8px;background:#1c140ecc;border:2px solid var(--rc);border-radius:20px;padding:2px 10px;font-size:.72rem;font-weight:800}.gbest b{color:var(--rc)}
.gact{background:linear-gradient(#3a2a1c,#2a1e14);border:2px solid #6b5644;border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:7px}
.gtop{display:flex;justify-content:space-between;align-items:center;font-size:.86rem}.gtop span{color:var(--sand);font-weight:800;font-variant-numeric:tabular-nums}
.gbuild{width:100%;display:flex;flex-direction:column;align-items:center;line-height:1.15}.gbuild small{font-size:.74rem}
.gprog{height:14px;border-radius:8px;background:#1c130d;border:2px solid #6b5644;overflow:hidden}.gprog div{height:100%;background:linear-gradient(90deg,#3fb59a,#7fe08a);transition:width .4s}
.gmax{text-align:center;color:#ffd447}
.gsec{background:#0004;border:2px solid #6b5644;border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px}
.gsh{display:flex;justify-content:space-between;align-items:baseline;gap:6px}.gsh b{font-size:.84rem;color:#ffd447}.gsh small{font-size:.66rem;color:var(--muted)}
.gchs{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.gch{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;gap:2px 6px;align-items:center;background:#241a14;border:2px solid color-mix(in srgb,var(--rc) 55%,#241a14);border-radius:9px;padding:5px 7px}
.gdot{width:10px;height:10px;border-radius:3px;background:var(--rc);box-shadow:0 0 6px var(--rc);transform:rotate(45deg)}
.gch b{font-size:.74rem;color:var(--rc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gch em{font-style:normal;font-weight:900;font-size:.78rem;font-variant-numeric:tabular-nums}
.gbar{grid-column:1/3;height:5px;border-radius:3px;background:#1c130d;overflow:hidden}.gbar div{height:100%;background:var(--rc)}
.gch small{font-size:.62rem;font-weight:900;text-align:right}.gch small.up{color:#7fe08a}.gch small.dn{color:#ff8a7a}
.glock{display:flex;flex-wrap:wrap;gap:4px}.glock span{font-size:.64rem;color:var(--muted);background:#1c130d;border:1px dashed color-mix(in srgb,var(--rc) 60%,#000);border-radius:12px;padding:2px 7px}.glock b{color:var(--rc)}
.wsgrid{display:flex;flex-direction:column;gap:5px}
.wst{display:grid;grid-template-columns:36px 1fr 104px;align-items:center;gap:8px;background:var(--night);border:2px solid #6b5644;border-left:5px solid var(--bc);border-radius:10px;padding:5px 7px;box-shadow:inset 0 0 10px #0008;min-width:0}
.wst>i{font-style:normal;font-size:1.3rem;width:36px;height:36px;display:grid;place-items:center;border-radius:8px;background:#0006;color:var(--bc)}
.wstt{display:flex;flex-direction:column;min-width:0;gap:1px}.wstt b{font-size:.88rem;color:var(--bc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wstt b em{font-style:normal;font-size:.72rem;color:var(--sand);font-weight:800;margin-left:5px}
.wstv{font-size:.72rem;line-height:1.25;color:#7fe08a;font-weight:700;font-variant-numeric:tabular-nums}
.wst .wsb{width:100%;min-width:0;padding:5px 4px}.wst.lockd{grid-template-columns:36px 1fr;opacity:.6;filter:grayscale(.5)}.wst.lockd .wstv{color:var(--muted)}.wstv em{font-style:normal;color:var(--muted);font-weight:600}
.wstmax{text-align:center;color:var(--sand);font-weight:800;font-size:.85rem}
.blist{display:flex;flex-direction:column;gap:6px;text-align:left}
.brow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--night);border-radius:8px;padding:9px 10px;border:2px solid #6b5644;border-left:5px solid var(--bc);box-shadow:inset 0 0 10px #0008}
.brow div{min-width:0;display:flex;flex-direction:column;gap:1px}
.brow b{font-size:.92rem}.brow b em{font-style:normal;color:var(--sand);font-size:.78rem;margin-left:4px}
.brow small{color:var(--muted);font-size:.74rem;font-variant-numeric:tabular-nums}
.wspg{flex:none;overflow:hidden;touch-action:pan-y}
.wstrack{display:flex;width:200%;align-items:flex-start;transition:transform .3s ease}
.wstrack>section{width:50%;box-sizing:border-box;padding:0 2px;display:flex;flex-direction:column;gap:8px}
.wshead{display:flex;align-items:center;justify-content:space-between;gap:8px}.wshead h2{margin:0;font-size:1.25rem}
.wsarr{flex:none;border:2px solid #6b5644;background:var(--night);color:var(--sand);border-radius:999px;padding:4px 10px;font:inherit;font-size:.8rem;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:4px}
.wsarr i{font-style:normal;font-size:1.2rem;line-height:1;display:inline-block}
.wsarr.r i{animation:wsnr 1.1s ease-in-out infinite}.wsarr.l i{animation:wsnl 1.1s ease-in-out infinite}
@keyframes wsnr{50%{transform:translateX(4px)}}@keyframes wsnl{50%{transform:translateX(-4px)}}
.wsdots{display:flex;justify-content:center;gap:6px;margin:8px 0 2px}.wsdots i{width:8px;height:8px;border-radius:50%;background:#6b5644}.wsdots i.on{background:var(--sand)}
.brow b em.skpas{color:#9ad0ff}
.brow.sksoon{opacity:.55;filter:grayscale(.6)}.skbald{color:var(--sand)!important;font-weight:800;text-align:center;font-size:.72rem!important}
.skon{font-size:.85rem;color:var(--muted)}.skon b{color:var(--sand)}.skon small{font-size:.75rem}
.brow:not(.skact){opacity:.8}.brow.skact{box-shadow:inset 0 0 10px #0008,0 0 0 2px var(--bc)}
.sktog{align-self:flex-start;margin:3px 0 1px;border:2px solid #6b5644;background:#2b2019;color:var(--muted);border-radius:999px;padding:2px 10px;font:inherit;font-size:.74rem;font-weight:800;cursor:pointer}
.sktog.on{background:#2f5a2a;border-color:#7fe08a;color:#d8ffd0}.sktog:disabled{opacity:.45;cursor:default}
.brow .btn{flex:none;padding:8px 10px;font-size:.8rem}
/* Ausrüstungs-Fenster: Stein- und Holzrahmen wie im Konzeptbild */
.gearbtn{border:0;background:none;padding:0;color:inherit;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left}
.gearbtn:focus-visible{outline:3px solid var(--sand);outline-offset:3px;border-radius:12px}
.gh{display:flex;justify-content:space-between;align-items:baseline}
.gh b{font-family:var(--display);font-weight:400;font-size:1.05rem;letter-spacing:.03em}
.gh small{color:var(--sand);font-weight:800;font-size:.8rem}
.gear{width:100%}
.card.wide{max-width:560px;padding:0;background:none;border:0;box-shadow:none;gap:0}
.eqwin{--st:#4a3a2e;--stl:#6b5644;--std:#221812;--gd:#d9a441;
  background:radial-gradient(ellipse at 50% 30%,#4f3d30,#33261d);border:4px solid var(--stl);border-radius:10px;
  box-shadow:inset 0 0 0 3px var(--std),inset 0 0 40px #0006,0 10px 30px #000a;padding:12px;display:flex;flex-direction:column;gap:10px;color:#f4e6cc;text-align:left}
.eqbar{display:flex;flex-wrap:wrap;gap:4px;background:var(--std);border:2px solid var(--stl);border-radius:6px;padding:5px}
.eqbar span{flex:1 1 auto;display:flex;align-items:center;justify-content:center;gap:4px;font-size:.68rem;font-weight:800;padding:4px 6px;border-radius:4px;
  background:color-mix(in srgb,var(--rc) 22%,#1a120d);border:1px solid color-mix(in srgb,var(--rc) 55%,#1a120d);color:#f4e6cc}
.eqbar span i{width:7px;height:7px;transform:rotate(45deg);background:var(--rc);box-shadow:0 0 6px var(--rc)}
.eqbar span.lock{opacity:.4}
.eqgrid{display:grid;grid-template-columns:62px 1fr 62px;gap:8px;align-items:start}
.eqcol{display:flex;flex-direction:column;gap:6px}
.eqslot,.invc{position:relative;aspect-ratio:1;border-radius:6px;cursor:pointer;padding:0;display:grid;place-items:center;
  background:linear-gradient(#2c211a,#1e1611);border:3px solid var(--stl);box-shadow:inset 0 0 0 2px var(--std),inset 0 0 14px color-mix(in srgb,var(--rc) 35%,transparent),0 2px 0 #120c08}
.eqslot{margin-top:10px}
.eqslot canvas,.invc canvas{width:86%;height:86%}
.eqslot i{font-style:normal;color:#8a7258;font-weight:800;font-size:1.3rem}
.eqslot .lbl{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--std);border:1px solid var(--stl);border-radius:4px;
  padding:1px 5px;font-size:.6rem;font-weight:800;color:#f4e6cc;white-space:nowrap}
.eqslot.sel,.invc.sel{border-color:var(--gd);box-shadow:inset 0 0 0 2px var(--std),0 0 0 2px var(--gd),inset 0 0 14px color-mix(in srgb,var(--rc) 45%,transparent)}
.eqslot:focus-visible,.invc:focus-visible,.sbtn:focus-visible{outline:3px solid var(--gd);outline-offset:2px}
.eqhero{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.eqhero canvas{width:100%;max-width:240px;aspect-ratio:360/460;background:radial-gradient(ellipse at 50% 60%,#6b5644aa,transparent 70%)}
.eqstats{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;font-weight:800;font-size:.78rem;font-variant-numeric:tabular-nums;color:#f4e6cc}
.eqd{display:grid;grid-template-columns:56px 1fr;gap:4px 10px;align-items:center;background:var(--std);border:2px solid var(--rc);border-radius:8px;padding:8px}
.eqd canvas{width:56px;height:56px}
.eqd>div{display:flex;flex-direction:column;gap:1px;min-width:0}
.eqd b{font-family:var(--display);font-weight:400;font-size:1.1rem;letter-spacing:.02em}
.eqd span{font-weight:800;font-size:.85rem}.eqd em{font-style:normal}
.eqdb{grid-column:1/-1;display:flex;gap:6px}
.hint{margin:0;color:#b8a488;font-size:.82rem;text-align:center}
.invhead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--stl);padding-bottom:3px}
.invhead span{font-family:var(--display);letter-spacing:.03em}.invhead small{color:#b8a488;font-weight:800}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;max-height:160px;overflow-y:auto;padding:2px}
.inv .hint{grid-column:1/-1}
.eqfoot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gold{display:flex;align-items:center;margin-right:auto;font-family:var(--display);font-size:1.25rem;color:#ffd447;text-shadow:0 2px 0 #000}

function castMod(m){

const itemEl=it=>it.el||(it.res&&it.res.el)||'';
const EL_ORDER=['gift','eis','feuer','blitz','schatten','licht'];

function invOrder(){const sOrd=id=>SLOTS.findIndex(x=>x.id===id);
  let idx=S.inv.map((_,i)=>i);if(S.invFilter)idx=idx.filter(i=>S.inv[i].slot===S.invFilter);
  if(S.invEl)idx=idx.filter(i=>itemEl(S.inv[i])===S.invEl);
  const m=invSort();
  if(m==='neu')return idx.reverse();
  return idx.sort((a,b)=>{const A=S.inv[a],B=S.inv[b];
    const byR=B.r-A.r,byS=sOrd(A.slot)-sOrd(B.slot),byV=itemScore(B)-itemScore(A);
    if(m==='el'){// zuerst, was in der aktuellen Welt hilft, dann nach Element gruppiert
      const Wd=world(),help=it=>(it.res&&it.res.el===Wd.atkEl)||(it.el&&it.el===Wd.weak)?0:1,eo=it=>{const e=itemEl(it);return e?EL_ORDER.indexOf(e):99;};
      return (help(A)-help(B))||(eo(A)-eo(B))||byR||byS||byV;}
    return m==='slot'?(byS||byR||byV):(byR||byS||byV);});}

function wbAttack(X=wb){if(X.busy||!X.st||X.st.day_left<=0)return;
  const B=X.boss(X.st.period),st=heroStats(),em=wbElMul(B),dps=wbDamage(B)/30;
  // Der Boss hat unendlich Leben und wird alle 10 s wütender (schlägt härter zu)
  const res=(st.res[B.atkEl]||0)/100,blk=st.block/100,bossHit=st.hp*0.09*(1-blk)*(1-(st.armor||0)/100)*(1-res);
  X.busy=true;X.res=null;
  X.anim={left:30,dmg:0,php:st.hp,pmax:st.hp,bhp:1,bmax:1,sp:[],orbs:[],fl:[],bhit:0,phit:0,sq:0,lunge:0,end:null,endT:0,
    throwT:0,bossT:1.2,reg:st.hp*st.reg/100};
  renderOnline();
  let last=performance.now();
  const step=now=>{const dt=Math.min(.05,(now-last)/1000);last=now;const A=X.anim;if(!A)return;
    if(!A.end){
      A.left-=dt;A.php=Math.min(A.pmax,A.php+A.reg*dt);
      // Kaktus wirft: Schaden pro Wurf aus der Gesamtleistung (Angriff, Krit, Drohnen, Module, Element)
      A.throwT-=dt;if(A.throwT<=0){A.throwT=.25;A.sq=1;A.sp.push({x:92,y:130+rnd(-8,8)});}
      A.sq=Math.max(0,A.sq-dt*6);
      for(const s2 of A.sp){s2.x+=520*dt;if(s2.x>240&&!s2.done){s2.done=true;const cr=Math.random()<st.crit/100,v=dps*.25*rnd(.85,1.15)*(cr?st.critM:1);
        A.dmg+=v;A.bhit=.1;A.fl.push({x:265+rnd(-22,22),y:105+rnd(-18,8),txt:fmt(v)+(cr?'!':''),c:cr?'#ffd447':em>1?ELEM[B.weak].c:'#fff',t:.7});}}
      A.sp=A.sp.filter(s2=>!s2.done);
      // Boss greift an
      A.bossT-=dt;if(A.bossT<=0){A.bossT=1.5;A.lunge=1;A.orbs.push({x:240,y:140});}
      A.lunge=Math.max(0,A.lunge-dt*3);
      simSk(A,dt);for(const o of A.orbs){o.x-=300*dt;if(o.x<95&&!o.done){o.done=true;if(A.dgOn>0){A.fl.push({x:70,y:70,txt:'Ausgewichen!',c:'#9ad0ff',t:.7});continue;}const v=bossHit*(1+Math.floor((30-A.left)/10)*.5)*rnd(.9,1.1);A.php-=v;A.phit=.15;
        A.fl.push({x:70,y:70,txt:'-'+fmt(v),c:'#ff8a7a',t:.7});}}
      A.orbs=A.orbs.filter(o=>!o.done);
      if(A.php<=0){A.end='dead';A.php=0;}else if(A.left<=0){A.end='time';A.left=0;}
    }else A.endT+=dt;
    A.bhit=Math.max(0,A.bhit-dt);A.phit=Math.max(0,A.phit-dt);for(const f of A.fl){f.y-=30*dt;f.t-=dt;}A.fl=A.fl.filter(f=>f.t>0);
    drawWb(X);
    const alive=X.alive()&&$(X.cv);
    if(alive&&!(A.end&&A.endT>1.6))requestAnimationFrame(step);else finish(A);};
  const finish=async A=>{const total=Math.round(A.dmg),why=A.end==='boss'?'Boss besiegt!':A.end==='dead'?'Du bist gefallen.':A.end==='time'?'Zeit abgelaufen.':'Kampf abgebrochen.';
    try{const r=await rpc(X.hitRpc,{p_code:ON.code,p_key:ON.key,p_dmg:total});
      if(r&&r.ok){const bonus=A.end==='boss'?3:0,caps=3*Math.min(10,2+bonus+Math.floor(Math.log10(r.added+1)/2)),coins=Math.round(r.added*.25*(A.end==='boss'?1.5:1));
        S.caps+=caps;S.coins+=coins;save();lastHud='';
        X.res=`<b>${why}</b> ${fmt(r.added)} Schaden · Belohnung: <em class="up">+${caps} Kapseln</em> · <em class="up">+${fmt(coins)} Münzen</em>${A.end==='dead'?'<br><small>Tipp: Mehr Leben, Schild oder '+ELEM[B.atkEl].n+'-Resistenz helfen.</small>':''}`;}
      else X.res=`<span class="down">${(r&&r.reason)||'Angriff nicht gezählt'}</span>`;}
    catch(e){X.res='<span class="down">Keine Verbindung, Angriff nicht gezählt.</span>';}
    X.busy=false;X.anim=null;if(olOpen)renderOnline();await X.load();};
  requestAnimationFrame(step);}

// Allianz-Chat: Nachrichten werden alle 4 s nachgeladen, solange der Chat offen ist, sonst jede Minute (für die Ungelesen-Anzeige)
let chat={msgs:[],last:0,unread:0,seen:+(localStorage.getItem('kk-chat-seen')||0)||0,busy:false};
function chatHtml(){if(!chat.msgs.length)return'<p class="hint">Noch keine Nachrichten. Sag Hallo!</p>';
  return chat.msgs.map(m=>{const me=m.code===ON.code,tm=new Date(m.created_at);
    return`<div class="cm${me?' me':''}"><small>${me?'Du':esc2(m.name)} · ${String(tm.getHours()).padStart(2,'0')}:${String(tm.getMinutes()).padStart(2,'0')}</small><span>${esc2(m.text)}</span></div>`;}).join('');}
async function pollChat(){if(chat.busy||!ON.code||!S.gUpg&&!gd.my)return;chat.busy=true;
  try{const r=await rpc('kk_guild_msgs',{p_code:ON.code,p_key:ON.key,p_after:chat.last});
    if(Array.isArray(r)&&r.length){chat.msgs=chat.msgs.concat(r).slice(-120);chat.last=r[r.length-1].id;}
    const open=olOpen&&olTab==='gilde'&&gd.sub==='chat';
    if(open&&chat.msgs.length){chat.seen=chat.last;try{localStorage.setItem('kk-chat-seen',chat.seen);}catch(e){}}
    chat.unread=chat.msgs.filter(m=>m.id>chat.seen&&m.code!==ON.code).length;
    const box=$('gchat');if(open&&box){const atEnd=box.scrollHeight-box.scrollTop-box.clientHeight<40;box.innerHTML=chatHtml();if(atEnd||r.length)box.scrollTop=box.scrollHeight;}
    const ob=$('onSub');if(ob&&chat.unread&&!open)$('onBtn').dataset.chat=chat.unread;else if($('onBtn'))delete $('onBtn').dataset.chat;
    if(chat.unread&&!open)$('allyBtn').dataset.chat=chat.unread;else delete $('allyBtn').dataset.chat;}
  catch(e){}finally{chat.busy=false;}}
setInterval(()=>{const open=olOpen&&olTab==='gilde'&&gd.sub==='chat';if(open||Date.now()%60000<4000)pollChat();},4000);
setTimeout(pollChat,7000);
// Allianz-Wochenziel
let goals={d:null,err:''};
const GOAL_REW={kills:[15,30,60],wb:[15,30,60]},GOAL_COIN=[100,250,600],TIERN=['Bronze','Silber','Gold'],TIERC=['#cd8a4a','#c8d0e0','#ffd447'];
async function loadGoals(){goals.err='';try{goals.d=await rpc('kk_guild_goals',{p_code:ON.code});}catch(e){goals.err='Keine Verbindung.';}
  if(olOpen&&olTab==='gilde'&&gd.sub==='ziele')renderOnline();}
function goalsHtml(){
  if(goals.err)return`<p class="hint warn">${goals.err}</p>`;if(!goals.d)return'<p class="hint">Lade Wochenziele …</p>';
  const D=goals.d,cl=D.claimed||[],coinBase=Math.ceil(3*cPow(S.stage));
  const card=(key,ico,name,unit)=>{const G=D[key],max=G.targets[2],pct=Math.min(1,G.cur/max);
    return`<div class="goal"><div class="gh2"><span class="gi">${ico}</span><div><b>${name}</b><small>${fmt(G.cur)} ${unit}</small></div></div>
      <div class="gtrack"><i style="width:${pct*100}%"></i>${G.targets.map((tg,i)=>`<em style="left:${tg/max*100}%;--tc:${TIERC[i]}" class="${G.cur>=tg?'ok':''}"></em>`).join('')}</div>
      <div class="gtiers">${G.targets.map((tg,i)=>{const done=G.cur>=tg,got=cl.includes(key+':'+i);
        return`<div class="gt" style="--tc:${TIERC[i]}"><b>${TIERN[i]}</b><small>${fmt(tg)}</small><span>+${GOAL_REW[key][i]} Kapseln<br>+${fmt(coinBase*GOAL_COIN[i])} Münzen</span>
          ${got?'<small class="got">✓ abgeholt</small>':`<button type="button" class="sbtn go" data-claim="${key}:${i}" ${done?'':'disabled'}>${done?'Abholen':'offen'}</button>`}</div>`;}).join('')}</div></div>`;};
  return card('kills','⚔','Gegner besiegen','Kills')+card('wb','👑','Weltboss-Schaden','Schaden')+
    `<p class="hint">Woche ${esc2(D.period)} · ${D.members} Mitglieder · Ziele wachsen mit der Allianz. Neue Woche ab Montag.</p>`;}
let gd={sub:'halle',my:undefined,info:null,list:null,err:'',msg:'',q:'',kick:null,leaveAsk:false,form:false};
const esc2=v=>String(v==null?'':v).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
async function loadGuild(){gd.err='';try{
    gd.my=ON.code?await rpc('kk_my_guild',{p_code:ON.code}):null;
    if(gd.my&&S.tkGuild!==gd.my){S.tkGuild=gd.my;S.tkSent=S.tk||0;save();}
    if(gd.my){gd.info=await rpc('kk_guild_info',{p_gid:gd.my});S.gBonus=gd.info?gd.info.level*2:0;S.gUpg=gd.info?gd.info.upg||{}:{};save();lastHud='';}
    else{gd.info=null;S.gBonus=0;S.gUpg={};gd.list=await rpc('kk_guild_list',{p_q:gd.q});}}
  catch(e){gd.err='Keine Verbindung. Allianzen gibt es nur auf kaktus-krieger.pages.dev.';}
  if(olOpen&&olTab==='gilde')renderOnline();}
setTimeout(()=>{if(ON.code)loadGuild();},5000); // Allianzbonus beim Start auffrischen
function guildBody(){
  if(gd.err)return`<p class="hint warn">${gd.err}</p>`;
  if(gd.my===undefined)return'<p class="hint">Lade Allianz …</p>';
  const msg=gd.msg?`<p class="hint warn">${esc2(gd.msg)}</p>`:'';
  if(gd.info){const G=gd.info,lead=G.leader===ON.code;
    const sub=`<div class="lbsw"><button type="button" class="${gd.sub==='halle'?'on':''}" data-gsub="halle">Mitglieder</button><button type="button" class="${gd.sub==='kasse'?'on':''}" data-gsub="kasse">Kasse</button><button type="button" class="${gd.sub==='ziele'?'on':''}" data-gsub="ziele">Ziele</button><button type="button" class="${gd.sub==='chat'?'on':''}" data-gsub="chat">Chat${chat.unread?' <i class="cdot">'+chat.unread+'</i>':''}</button></div>`;

    const head=`<div class="ghead"><div><b>${esc2(G.name)} <em>[${esc2(G.tag)}]</em></b><small>${esc2(G.about)}</small></div>
        <span class="glv">Lv ${G.level}<small>+${G.level*2}% Münzen</small></span></div>`;
    if(gd.sub==='ziele')return head+sub+msg+goalsHtml();
    if(gd.sub==='boss')gd.sub='halle';
    if(gd.sub==='chat')return head+sub+msg+`<div class="gchat" id="gchat">${chatHtml()}</div>
      <div class="ofind"><input id="gMsg" class="oin" maxlength="200" placeholder="Nachricht an die Allianz …" autocomplete="off"><button class="sbtn go" type="button" id="gSend">Senden</button></div>
      <p class="hint">Bitte freundlich bleiben. Links sind nicht erlaubt.</p>`;
    if(gd.sub==='kasse'){const amt=[.1,.25,.5].map(f=>Math.floor(S.coins*f));
      return head+sub+msg+`<div class="gbank"><small>Allianzkasse</small><b>${fmt(G.bank)}</b><span>Deine Münzen: ${fmt(S.coins)}</span>
          <div class="gdon">${amt.map((a,i)=>`<button type="button" class="sbtn" data-don="${a}" ${a<1?'disabled':''}>${['10 %','25 %','50 %'][i]}<small>${fmt(a)}</small></button>`).join('')}</div></div>
        <div class="gups">${GUPG.map(U=>{const lv=+(G.upg&&G.upg[U.id])||0,cost=gUpCost(U,lv),max=lv>=GUPG_MAX;
          return`<div class="gup"><span class="gi">${U.ico}</span><div><b>${U.n} <em>Lv ${lv}/${GUPG_MAX}</em></b><small>${U.d} · jetzt +${lv*U.per}${U.unit}</small>
            <span class="gbar"><i style="width:${lv/GUPG_MAX*100}%"></i></span></div>
            ${max?'<small class="max">Max</small>':lead?`<button type="button" class="sbtn go" data-gup="${U.id}" ${G.bank<cost?'disabled':''}>${fmt(cost)}</button>`:`<small class="gcost">${fmt(cost)}</small>`}</div>`;}).join('')}</div>
        <p class="hint">${lead?'Als Anführer kaufst du Upgrades aus der Kasse.':'Nur der Anführer kann Upgrades kaufen. Spende, damit er es kann!'} Upgrades wirken für alle Mitglieder.</p>
        <ol class="lb">${G.members.slice().sort((a,b)=>b.don-a.don).filter(m=>m.don>0).map((m,i)=>`<li class="${m.code===ON.code?'me':''}"><div class="gm"><span class="rk">${i+1}</span><span class="nm"><b>${esc2(m.name)}</b><small>gespendet</small></span><span class="vl">${fmt(m.don)}</span></div></li>`).join('')}</ol>`;}
    return head+sub+`<span hidden><div class="ghead"><div><b>${esc2(G.name)} <em>[${esc2(G.tag)}]</em></b><small>${esc2(G.about)}</small></div>
        <span class="glv">Lv ${G.level}<small>+${G.level*2}% Münzen</small></span></div></span>${msg}
      <ol class="lb gmem">${G.members.map((m,i)=>`<li class="${m.code===ON.code?'me':''}"><div class="gm" data-fc="${m.code}" role="button" tabindex="0" title="Profil ansehen">
        <span class="rk">${m.code===G.leader?'👑':i+1}</span><span class="nm"><b>${esc2(m.name)}${m.code===ON.code?' <em>(du)</em>':''}</b><small>${esc2(m.cls||'')} · ${stageName(m.best)}</small></span>
        <span class="vl">${fmt(m.power)}<small>Boss ${fmt(m.wb)}</small></span>
        ${lead&&m.code!==ON.code?`<button type="button" class="gk${gd.kick===m.code?' ask':''}" data-kick="${m.code}" title="Entfernen">${gd.kick===m.code?'Sicher?':'✕'}</button>`:''}</div></li>`).join('')}</ol>
      <p class="hint">${G.members.length}/20 Mitglieder · Level steigt mit den Stages aller Mitglieder (je 100 Stages ein Level)</p>
      <div class="eqdb"><button class="sbtn ${gd.leaveAsk?'red':''}" type="button" id="gLeave">${gd.leaveAsk?'Wirklich verlassen?':'Allianz verlassen'}</button><button class="sbtn" type="button" id="gRe">Aktualisieren</button></div>`;}
  return`${msg}<div class="ofind"><input id="gQ" class="oin" maxlength="20" placeholder="Allianz suchen" value="${esc2(gd.q)}" autocomplete="off"><button class="sbtn" type="button" id="gSearch">Suchen</button></div>
    ${!gd.list?'<p class="hint">Lade Allianzen …</p>':!gd.list.length?'<p class="hint">Noch keine Allianz gefunden. Gründe die erste!</p>':
    `<ol class="lb">${gd.list.map(G=>`<li><div class="gm"><span class="rk">${G.level}</span><span class="nm"><b>${esc2(G.name)} <em>[${esc2(G.tag)}]</em></b><small>${esc2(G.about)||'&nbsp;'}</small></span>
      <span class="vl">${G.members}/20</span><button type="button" class="sbtn go gj" data-join="${G.id}" ${G.members>=20||!ON.code?'disabled':''}>Beitreten</button></div></li>`).join('')}</ol>`}
    ${gd.form?`<div class="gform"><input id="gN" class="oin" maxlength="20" placeholder="Allianzname (3–20 Zeichen)" autocomplete="off">
      <input id="gT" class="oin" maxlength="4" placeholder="Kürzel, z. B. KAK" autocomplete="off" style="text-transform:uppercase">
      <input id="gA" class="oin" maxlength="120" placeholder="Beschreibung (optional)" autocomplete="off">
      <div class="eqdb"><button class="sbtn" type="button" id="gCancel">Abbrechen</button><button class="sbtn go" type="button" id="gMake" ${S.coins<GUILD_COST?'disabled':''}>Gründen · ${fmt(GUILD_COST)}</button></div></div>`
    :`<div class="eqdb"><button class="sbtn go" type="button" id="gNew" ${!ON.code?'disabled':''}>Neue Allianz gründen</button></div>`}`;
}
function wireGuild(){
  const q=id=>$(id),act=async(fn,body,after)=>{gd.msg='';try{const r=await rpc(fn,Object.assign({p_code:ON.code,p_key:ON.key},body));
      if(r&&r.ok===false)gd.msg=r.reason;else if(after)after(r);}catch(e){gd.msg='Keine Verbindung.';}await loadGuild();};
  if(q('gSearch')){const go=()=>{gd.q=q('gQ').value.trim();gd.list=null;renderOnline();loadGuild();};q('gSearch').onclick=go;q('gQ').onkeydown=e=>{if(e.key==='Enter')go();};}
  $('card').querySelectorAll('[data-join]').forEach(b=>b.onclick=()=>act('kk_guild_join',{p_gid:+b.dataset.join}));
  if(q('gNew'))q('gNew').onclick=()=>{gd.form=true;renderOnline();};
  if(q('gCancel'))q('gCancel').onclick=()=>{gd.form=false;renderOnline();};
  if(q('gMake'))q('gMake').onclick=()=>{if(S.coins<GUILD_COST)return;
    act('kk_guild_create',{p_name:q('gN').value,p_tag:q('gT').value,p_about:q('gA').value},()=>{S.coins-=GUILD_COST;gd.form=false;save();lastHud='';});};
  $('card').querySelectorAll('[data-kick]').forEach(b=>b.onclick=e=>{e.stopPropagation();const tgt=b.dataset.kick;if(gd.kick!==tgt){gd.kick=tgt;renderOnline();return;}gd.kick=null;act('kk_guild_kick',{p_target:tgt});});
  if(q('gLeave'))q('gLeave').onclick=()=>{if(!gd.leaveAsk){gd.leaveAsk=true;renderOnline();return;}gd.leaveAsk=false;act('kk_guild_leave',{});};
  if(q('gRe'))q('gRe').onclick=()=>{gd.leaveAsk=false;gd.kick=null;loadGuild();};
  $('card').querySelectorAll('[data-gsub]').forEach(b=>b.onclick=()=>{gd.sub=b.dataset.gsub;gd.msg='';if(gd.sub==='boss'&&!ab.busy)loadAb();if(gd.sub==='ziele'){goals.d=null;loadGoals();}if(gd.sub==='chat'&&chat.msgs.length){chat.seen=chat.last;chat.unread=0;try{localStorage.setItem('kk-chat-seen',chat.seen);}catch(e){}if($('onBtn'))delete $('onBtn').dataset.chat;}renderOnline();if(gd.sub==='chat')pollChat();});
  $('card').querySelectorAll('[data-claim]').forEach(b=>b.onclick=async()=>{const [goal,ti]=b.dataset.claim.split(':'),i=+ti;b.disabled=true;
    try{const r=await rpc('kk_guild_claim',{p_code:ON.code,p_key:ON.key,p_goal:goal,p_tier:i});
      if(r&&r.ok){const caps=GOAL_REW[goal][i],coins=Math.ceil(3*cPow(S.stage))*GOAL_COIN[i];S.caps+=caps;S.coins+=coins;save();lastHud='';
        banner={txt:TIERN[i]+'-Belohnung: +'+caps+' Kapseln',t:2.2};gd.msg='';}else gd.msg=(r&&r.reason)||'Nicht abgeholt';}
    catch(e){gd.msg='Keine Verbindung.';}
    await loadGoals();});
  if(q('gchat')){const box=q('gchat');box.scrollTop=box.scrollHeight;if(chat.msgs.length){chat.seen=chat.last;chat.unread=0;try{localStorage.setItem('kk-chat-seen',chat.seen);}catch(e){}}}
  if(q('gSend')){const send=async()=>{const inp=q('gMsg'),tx=inp.value.trim();if(!tx)return;q('gSend').disabled=true;
      try{const r=await rpc('kk_guild_say',{p_code:ON.code,p_key:ON.key,p_text:tx});
        if(r&&r.ok){inp.value='';gd.msg='';}else{gd.msg=(r&&r.reason)||'Nicht gesendet';const keep=tx;renderOnline();q('gMsg').value=keep;}}
      catch(e){gd.msg='Keine Verbindung.';renderOnline();}
      finally{if(q('gSend'))q('gSend').disabled=false;await pollChat();if(q('gMsg'))q('gMsg').focus();}};
    q('gSend').onclick=send;q('gMsg').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();send();}};}
  $('card').querySelectorAll('[data-don]').forEach(b=>b.onclick=()=>{const a=Math.floor(+b.dataset.don);if(a<1||S.coins<a)return;
    S.coins-=a;save();lastHud='';b.disabled=true;
    act('kk_guild_donate',{p_amount:a},r=>{banner={txt:'+'+fmt(a)+' für die Allianz',t:1.8};}).then(()=>{if(gd.msg){S.coins+=a;save();lastHud='';renderOnline();}});});
  $('card').querySelectorAll('[data-gup]').forEach(b=>b.onclick=()=>{b.disabled=true;const U=GUPG.find(x=>x.id===b.dataset.gup);
    act('kk_guild_upgrade',{p_upg:U.id},r=>{banner={txt:U.n+' Lv '+r.level+'!',t:2};});});
}

let lbBy='best',lbData=null,lbErr='',lbAt=0;
async function loadLb(){lbErr='';try{lbData=await rpc('kk_leaderboard',{p_by:lbBy,p_limit:50});lbAt=Date.now();}catch(e){lbData=null;lbErr='Keine Verbindung. Die Bestenliste gibt es nur auf kaktus-krieger.pages.dev.';}if(olOpen&&olTab==='liste')renderOnline();}
let pinMsg='',loginMsg='';
const loginForm=p=>`<div class="pinrow"><input id="${p}LCode" class="oin" placeholder="Freundescode" maxlength="7" autocomplete="off" spellcheck="false" style="text-transform:uppercase">
    <input id="${p}LPin" class="oin pin" type="password" inputmode="numeric" maxlength="4" placeholder="PIN" autocomplete="current-password"></div>
  <div class="eqdb"><button class="sbtn red" type="button" id="${p}LGo">Konto laden</button></div>
  ${loginMsg?`<p class="hint warn">${loginMsg}</p>`:''}`;
function bindLogin(p,rerender){
  const go=async()=>{const code=normCode($(p+'LCode').value),pin=$(p+'LPin').value.trim();
    if(code.length!==6){loginMsg='Ein Freundescode hat 6 Zeichen.';rerender();return;}
    if(!/^[0-9]{4}$/.test(pin)){loginMsg='Die PIN hat 4 Ziffern.';rerender();return;}
    loginMsg='Lade …';rerender();
    try{const r=await rpc('kk_pin_login',{p_code:code,p_pin:pin});
      if(!r||!r.ok){loginMsg=(r&&r.reason)||'Anmelden fehlgeschlagen.';rerender();return;}
      switching=true;ON={code:r.code,key:r.key,pin:true};saveOn();
      try{localStorage.setItem(KEY,JSON.stringify(r.save||Object.assign(newState(),{caps:0,gift:{caps:500,kak:20}})));}catch(e){}
      loginMsg='Geladen! Das Spiel startet neu …';rerender();setTimeout(()=>location.reload(),900);}
    catch(e){loginMsg='Laden fehlgeschlagen: keine Verbindung. Online-Funktionen gibt es nur auf kaktus-krieger.pages.dev.';rerender();}};
  $(p+'LGo').onclick=go;$(p+'LPin').onkeydown=e=>{if(e.key==='Enter')go();};
}
function renderOnline(){
  const tabs=`<div class="eqtabs" role="tablist">${[['profil','Profil'],['freunde','Freunde'],['liste','Rangliste'],['gilde','Allianz']].map(([k,n])=>`<button type="button" role="tab" aria-selected="${olTab===k}" data-otab="${k}">${n}</button>`).join('')}</div>`;
  let body='';
  if(olTab==='profil'){
    const st=onState==='ok'?`<span class="ost ok">● Online gespeichert ${agoTxt(onLast)}</span>`:onState==='off'?'<span class="ost off">● Keine Verbindung. Online-Funktionen gibt es nur auf kaktus-krieger.pages.dev.</span>':onState==='err'?`<span class="ost err">● Fehler beim Speichern: ${onMsg.replace(/</g,'&lt;')}</span>`:'<span class="ost">● Verbinde …</span>';
    body=`<div class="ocard"><small>Dein Freundescode</small><b class="ocode">${ON.code?fmtCode(ON.code):'– – –'}</b>

        <p class="hint" style="margin:0">${ON.pin?'<b style="color:#7fe08a">PIN ist gesetzt ✓</b> Mit Freundescode und PIN kannst du dein Konto auf jedem Gerät laden.':'Setze eine <b>4-stellige PIN</b>. Mit Freundescode und PIN kannst du dein Konto dann auf einem anderen Gerät laden.'}</p>
        <div class="pinrow"><input id="oPinNew" class="oin pin" type="password" inputmode="numeric" maxlength="4" placeholder="PIN" autocomplete="new-password">
          <button class="sbtn go" type="button" id="oPinSet" ${ON.code&&ON.key?'':'disabled'}>${ON.pin?'PIN ändern':'PIN speichern'}</button></div>
        ${pinMsg?`<p class="hint warn" style="margin:0">${pinMsg}</p>`:''}</div>
      <details class="odet"${loginMsg?' open':''}><summary>Konto auf dieses Gerät laden</summary>
        <p class="hint">Gib den Freundescode und die PIN deines Kontos ein. Der Spielstand auf diesem Gerät wird dabei ersetzt, und auf dem alten Gerät wirst du abgemeldet.</p>
        ${loginForm('o')}

  }else if(olTab==='liste'){
    const medal=i=>i===0?'🥇':i===1?'🥈':i===2?'🥉':String(i+1);
    body=`<div class="lbsw"><button type="button" class="${lbBy==='best'?'on':''}" data-lb="best">Höchste Stage</button><button type="button" class="${lbBy==='power'?'on':''}" data-lb="power">Kampfkraft</button></div>
      ${lbErr?`<p class="hint warn">${lbErr}</p>`:!lbData?'<p class="hint">Lade Bestenliste …</p>':!lbData.length?'<p class="hint">Noch niemand eingetragen. Sei der Erste!</p>':
      `<ol class="lb">${lbData.map((r,i)=>`<li class="${r.code===ON.code?'me':''}${i<3?' top':''}"><button type="button" data-fc="${r.code}">
        <span class="rk">${medal(i)}</span><span class="nm"><b>${String(r.name).replace(/</g,'&lt;')}${r.code===ON.code?' <em>(du)</em>':''}</b><small>${r.cls||''}</small></span>
        <span class="vl">${lbBy==='best'?stageName(r.best):fmt(r.power)}</span></button></li>`).join('')}</ol>`}
      ${lbData?`<p class="hint">Stand ${agoTxt(lbAt)} · <button type="button" class="lnk" id="lbRe">aktualisieren</button> · Antippen zeigt das Profil</p>`:''}`;

const LEAGUES=[{n:'Bronze',min:0,c:'#cd8a4a'},{n:'Silber',min:1100,c:'#c8d0e0'},{n:'Gold',min:1250,c:'#ffd447'},{n:'Platin',min:1450,c:'#5fe0d0'},{n:'Diamant',min:1700,c:'#b48cff'}];

const BOTN=['Trainings-Kaktus','Übungs-Säule','Sandsack-Kaktus','Holzkaktus','Strohkaktus'];
function makeBots(n,pts){const me=arStats(),out=[];for(let i=0;i<n;i++){const f=rnd(.75,1.15),G={};
    for(const sl of SLOTS){const mine=S.gear[sl.id];if(!mine&&Math.random()<.5)continue;
      const r=mine?Math.max(0,Math.min(RAR.length-1,mine.r+Math.round(rnd(-1,1)))):Math.round(rnd(0,2)),it={slot:sl.id,r,name:sl.names[r],lvl:S.stage,v:itemValue(sl,r,S.stage,rnd(.9,1.1))};
      const one=a=>a[Math.floor(Math.random()*a.length)];if(sl.id==='waffe'&&r>=1)it.el=one(Object.keys(ELEM));else if(r>=1&&Math.random()<.55)it.res={el:one(ATK_ELS),v:Math.round(4*RAR[r].pm)};G[sl.id]=it;}
    out.push({code:'BOT',bot:true,name:BOTN[i%BOTN.length],cls:'Training',pts:Math.round(pts+rnd(-60,60)),power:Math.round(powerNow()*f),
      stats:{atk:me.atk*f,hp:Math.round(me.hp*f),spd:me.spd,block:Math.min(40,me.block*f),crit:Math.min(30,me.crit*f)},
      card:{char:{name:'',shape:pick(SHAPES),color:COLORS[Math.floor(Math.random()*COLORS.length)][1],eyes:pick(EYES),hat:pick(HATS),cls:'schuetze'},gear:G}});}
  return out;}

async function arFight(o){if(ar.fight)return;ar.msg='';ar.res=null;
  let r;try{r=await rpc('kk_ar_fight',{p_code:ON.code,p_key:ON.key,p_opp:o.bot?'BOT':o.code,p_bot:o.bot?Object.assign({pts:o.pts},o.stats):null});}
  catch(e){ar.msg='Keine Verbindung.';renderArena();return;}
  if(!r||!r.ok){ar.msg=(r&&r.reason)||'Kampf nicht möglich';renderArena();return;}
  // Animation: die Zeiten vom Server bestimmen, wer zuerst fällt
  const me=arStats(),end=Math.min(r.t_me,r.t_op),scale=Math.min(10,Math.max(5,end))/end;
  ar.fight={o,r,t:0,dur:end*scale,meT:r.t_me*scale,opT:r.t_op*scale,mhp:me.hp,ohp:(r.opp&&r.opp.hp)||o.stats.hp,sp:[],fl:[],thr:0,othr:.3,done:false};
  renderArena();let last=performance.now();
  const step=now=>{const F=ar.fight;if(!F)return;const dt=Math.min(.05,(now-last)/1000);last=now;
    if(!F.done){F.t+=dt;F.thr-=dt;F.othr-=dt;
      if(F.thr<=0){F.thr=.35;F.sp.push({x:110,y:110,dir:1});}
      if(F.othr<=0){F.othr=.35;F.sp.push({x:250,y:110,dir:-1});}

function autoTick(dt){

  for(let n=multiOpen();n>0&&S.caps>=1;n--){
    S.caps--;const it=rollItem(),cur=S.gear[it.slot];

      setAuto(false);pending=it;$('modal').hidden=false;reveal();
      banner={txt:isNew?'Neue Seltenheit!':'Auto hält an: '+RAR[it.r].n,t:2};save();return;

      it.auto=true;pending=it;$('modal').hidden=false;reveal();save();lastHud='';return;}

const OFFLINE_CAP=8*3600,OFF_EFF=0.6;

  const coins=Math.round(kills*coinPer*OFF_EFF*coinMul()),caps=Math.floor(kills*0.15);

}

}

function dgFight(){const T=dgT(),cp=dg.type==='caps',D=dgState();if(dg.anim||dgKeys()<=0)return;D.used++;save();

    if(!A.end){A.left-=dt;A.php=Math.min(A.pmax,A.php+A.reg*dt);
      A.throwT-=dt;if(A.throwT<=0){A.throwT=.25;A.sq=1;A.sp.push({x:92,y:130+rnd(-8,8)});}A.sq=Math.max(0,A.sq-dt*6);

function exStart(M,id){const R=exState().runs;if(R[M.id]||exBusy(id)||S.drEq.includes(id)||!S.dr[id])return;

function exClaim(M){const R=exState().runs,run=R[M.id];if(!run||Date.now()<run.end)return;const lv=(S.dr[run.dog]&&S.dr[run.dog].lv)||1,W=exReward(M,lv),out=[];
  delete R[M.id];S.coins+=W.coins;out.push(`<em class="up">+${fmt(W.coins)} Münzen</em>`);
  if(Math.random()<W.kakChance){S.kak=(S.kak||0)+W.kak;out.push(`<em class="up">+${W.kak} 🌵</em>`);}

    const it={id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),slot:sl.id,r,v:itemValue(sl,r,S.best,rnd(ROLL_LO,ROLL_HI)),lvl:S.best,name:sl.names[r]};
    const els=Object.keys(ELEM);if(sl.id==='waffe')it.el=els[Math.floor(Math.random()*els.length)];else it.res={el:ATK_ELS[Math.floor(Math.random()*ATK_ELS.length)],v:Math.round(4*RAR[r].pm)};
    exMsg+=` · <span style="color:${RAR[r].c}">${it.name}</span>`;save();lastHud='';it.ex=true;pending=it;reveal();return;}
  save();lastHud='';renderEx();}
function renderEx(){if(pending)return;const R=exState().runs,free=exFree(),now=Date.now();

// ---------- Spielzeit-Truhen: jeden Tag neu nach 15 min, 30 min, 1 h, 2 h, 3 h, 4 h, 5 h und 6 h Spielzeit ----------
const PT=[{m:15,coin:150,kc:.25,k:1,ic:0,cap:10},{m:30,coin:300,kc:.35,k:1,ic:.35,cap:15},{m:60,coin:600,kc:.5,k:2,ic:.5,cap:20},{m:120,coin:1000,kc:.7,k:2,ic:.75,cap:30},
  {m:180,coin:1500,kc:1,k:3,ic:1,cap:40},{m:240,coin:2000,kc:1,k:3,ic:1,cap:50},{m:300,coin:2500,kc:1,k:4,ic:1,cap:60},{m:360,coin:3500,kc:1,k:5,ic:1,cap:80}];
const ptDay=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();};
function ptState(){if(!S.pt||S.pt.day!==ptDay())S.pt={day:ptDay(),sec:0,got:[]};return S.pt;}
let ptOpen=false,ptMsg='',ptLastTxt='';
function ptTick(dt){const P=ptState();P.sec+=dt;}
const ptReady=i=>{const P=ptState();return !P.got.includes(i)&&P.sec>=PT[i].m*60;};
function ptNext(){const P=ptState();for(let i=0;i<PT.length;i++)if(!P.got.includes(i)&&P.sec<PT[i].m*60)return i;return -1;}
const mmss=sec=>{sec=Math.max(0,Math.ceil(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s2=sec%60;return h?h+':'+String(m).padStart(2,'0')+':'+String(s2).padStart(2,'0'):m+':'+String(s2).padStart(2,'0');};
// Ausrüstung, die dich weiterbringt: besser als das, was du an diesem Platz trägst, und mit der passenden Resistenz für deine Welt
function ptItem(){const Wd=world(),R=SLOTS.map(sl=>({sl,cur:S.gear[sl.id]})).sort((a,b)=>(a.cur?a.cur.r:-1)-(b.cur?b.cur.r:-1)||Math.random()-.5);
  for(const {sl,cur} of R.slice(0,4)){const w=gWeights(S.glv),tot=w.reduce((a,b)=>a+b,0);let x=Math.random()*tot,r=0;for(;r<RAR.length-1;r++){x-=w[r];if(x<=0)break;}
    if(cur)r=Math.max(r,cur.r);let v=itemValue(sl,r,S.stage,ROLL_HI);
    if(cur&&v<=cur.v&&r<RAR.length-1){r++;v=itemValue(sl,r,S.stage,ROLL_HI);}
    if(cur&&v<=cur.v)continue;
    const it={id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),slot:sl.id,r,v,lvl:S.stage,name:sl.names[r]};
    if(sl.id==='waffe')it.el=Wd.weak;else it.res={el:Wd.atkEl,v:Math.round(4*RAR[Math.max(1,r)].pm)};
    return it;}
  return null;}
function ptClaim(i){if(!ptReady(i))return;const P=ptState(),C=PT[i],out=[];P.got.push(i);
  const coins=Math.round(6*cPow(S.stage)*C.coin);S.coins+=coins;out.push(`<em class="up">+${fmt(coins)} Münzen</em>`);
  if(C.cap){S.caps+=C.cap;out.push(`<em class="up">+${C.cap} Kapseln</em>`);}
  if(Math.random()<C.kc){const k=C.k+diffIdx(S.stage);S.kak=(S.kak||0)+k;out.push(`<em class="up">+${k} 🌵</em>`);}
  if(Math.random()<C.ic){const it=ptItem();if(it)out.push(twGive(it));else{S.caps+=5;out.push('<em class="up">+5 Kapseln</em>');}}
  ptMsg=`🎁 <b>Truhe ${C.m<60?C.m+' Min':C.m/60+' Std'}:</b> `+out.join(' · ');save();lastHud='';renderPt();}
function renderPt(){const P=ptState();
  $('card').innerHTML=`<h2>🎁 Spielzeit-Truhen</h2><p class="hint" style="margin:0">Heute gespielt: <b>${mmss(P.sec)}</b> · Jeden Tag gibt es neue Truhen.</p>
    <div class="ptlist">${PT.map((C,i)=>{const got=P.got.includes(i),rd=ptReady(i),left=C.m*60-P.sec;
      return`<div class="ptc${got?' got':rd?' rd':''}"><span class="pti">${got?'📭':rd?'🎁':'🧰'}</span><div><b>${C.m<60?C.m+' Minuten':C.m/60+(C.m===60?' Stunde':' Stunden')}</b>
        <small>Münzen · ${C.cap} Kapseln${C.kc>=1?' · Kakteen':C.kc>0?' · ab und zu Kakteen':''}${C.ic>=1?' · Ausrüstung':C.ic>0?' · ab und zu Ausrüstung':''}</small></div>
        ${got?'<span class="ptst">✓ Geöffnet</span>':rd?`<button class="sbtn go" type="button" data-pt="${i}">Öffnen</button>`:`<span class="ptst">noch ${mmss(left)}</span>`}</div>`;}).join('')}</div>
    ${ptMsg?`<div class="wbres">${ptMsg}</div>`:''}
    <div class="row"><button class="btn" id="ptX" type="button">Schließen</button></div>`;
  $('card').querySelectorAll('[data-pt]').forEach(b=>b.onclick=()=>ptClaim(+b.dataset.pt));
  $('ptX').onclick=()=>{ptOpen=false;ptMsg='';$('modal').hidden=true;};}
$('chestBtn').onclick=()=>{if(!$('modal').hidden||editing)return;ptOpen=true;ptMsg='';$('modal').hidden=false;renderPt();};
// Anzeige am Knopf: Zeit bis zur nächsten Truhe, leuchtet wenn eine bereit ist
setInterval(()=>{if(!S.char)return;const P=ptState(),rd=PT.some((_,i)=>ptReady(i)),nx=ptNext();
  const txt=rd?'Öffnen!':nx<0?'✓ alle':mmss(PT[nx].m*60-P.sec);if(txt!==ptLastTxt){$('chestTxt').textContent=txt;ptLastTxt=txt;}
  $('chestBtn').classList.toggle('rd',rd);$('chestBtn').classList.toggle('done',!rd&&nx<0);},1000);

const tut={on:false,i:0,wait:false,box:null};
function tutVisible(e){if(!e||e.hidden)return false;const r=e.getBoundingClientRect();return r.width>4&&r.height>4&&getComputedStyle(e).visibility!=='hidden';}
function tutStart(){if(tut.on)return;tut.on=true;tut.i=0;tut.wait=false;
  const b=document.createElement('div');b.className='tut';b.id='tut';
  b.innerHTML='<div class="tblk"></div><div class="tblk"></div><div class="tblk"></div><div class="tblk"></div><div class="tspot none"></div><div class="tbub"></div>';
  document.body.appendChild(b);tut.box=b;tutShow();}
function tutEnd(skipped){if(!tut.on)return;tut.on=false;if(tut.box)tut.box.remove();tut.box=null;S.tut2=1;
  if(!skipped){S.caps+=5;banner={txt:'+5 Samenkapseln · Starthilfe',t:2.4};}save();lastHud='';}
function tutNext(){tut.i++;while(tut.i<TUT.length&&TUT[tut.i].el&&!tutVisible($(TUT[tut.i].el)))tut.i++;
  if(tut.i>=TUT.length){tutEnd(false);return;}tutShow();}
function tutShow(){const st=TUT[tut.i],b=tut.box;if(!b)return;
  {const el=st.el&&$(st.el),sec=el&&el.closest('.tab');if(sec)tabGo(sec.dataset.t);}
  if(st.act==='cap'&&S.caps<1){S.caps=1;lastHud='';}
  const n=(S.char&&S.char.name)||'Kaktus',total=TUT.length;
  b.querySelector('.tbub').innerHTML=`<div class="tava">🌵</div><div class="ttx"><b class="tn">Opa Stachel</b><p>${st.t.replace('{name}',n)}</p>
    ${st.d?`<p class="tdo">${st.d}</p>`:''}
    <div class="trow"><small>${tut.i+1} / ${total}</small>${st.last?'':'<button class="tskip" type="button">Überspringen</button>'}
    ${st.act?'':`<button class="tnext" type="button">${st.last?'Los geht’s!':'Weiter ›'}</button>`}</div></div>`;
  const nx=b.querySelector('.tnext');if(nx)nx.onclick=e=>{e.stopPropagation();tutNext();};
  const sk=b.querySelector('.tskip');if(sk)sk.onclick=e=>{e.stopPropagation();tutEnd(true);};
  tutPlace();}
function tutPlace(){const b=tut.box;if(!b)return;const st=TUT[tut.i],sp=b.querySelector('.tspot'),bub=b.querySelector('.tbub'),bl=b.querySelectorAll('.tblk');
  const W=innerWidth,H=innerHeight,e=st.el?$(st.el):null;
  // während eine Kapsel aufgeht (Fenster offen), tritt die Einführung zur Seite
  const hide=!$('modal').hidden;b.style.display=hide?'none':'';if(hide)return;
  if(!e){sp.className='tspot none';sp.style.cssText='';bl[0].style.cssText='left:0;top:0;width:100%;height:100%';for(let k=1;k<4;k++)bl[k].style.cssText='display:none';
    bub.style.top=Math.max(16,H/2-bub.offsetHeight/2)+'px';return;}
  const r=e.getBoundingClientRect(),pad=6;let x=r.left-pad,y=r.top-pad,w=r.width+2*pad,h=r.height+2*pad;
  if(y<4){h+=y-4;y=4;}if(y+h>H-4)h=H-4-y;
  // nicht unter die feste Leiste unten (Werkstatt, Hunde, Gärtnerei) ragen
  {const A=document.querySelector('.actions');if(A&&!A.contains(e)){const at=A.getBoundingClientRect().top;if(y+h>at-4)h=Math.max(30,at-4-y);}}
  sp.className='tspot'+(st.act?' pulse':'');sp.style.left=x+'px';sp.style.top=y+'px';sp.style.width=w+'px';sp.style.height=h+'px';
  // Klicks nur auf das Ziel durchlassen, wenn der Spieler es antippen soll; sonst alles blockieren
  if(st.act){bl[0].style.cssText=`left:0;top:0;width:100%;height:${y}px`;bl[1].style.cssText=`left:0;top:${y+h}px;width:100%;height:${Math.max(0,H-y-h)}px`;
    bl[2].style.cssText=`left:0;top:${y}px;width:${x}px;height:${h}px`;bl[3].style.cssText=`left:${x+w}px;top:${y}px;width:${Math.max(0,W-x-w)}px;height:${h}px`;}
  else{bl[0].style.cssText='left:0;top:0;width:100%;height:100%';for(let k=1;k<4;k++)bl[k].style.cssText='display:none';}
  // Sprechblase dorthin, wo mehr Platz ist
  const bh=bub.offsetHeight,below=H-(y+h),above=y;
  let top=below>=above?y+h+12:y-bh-12;top=Math.max(8,Math.min(H-bh-8,top));bub.style.top=top+'px';}
// Kapsel-Schritt: weiter, sobald die Kapsel geöffnet und das Fenster wieder zu ist

    if(!S.tut2&&performance.now()>3000&&S.char&&!editing&&!S.gift&&$('modal').hidden&&!(maint.on&&!maint.dev))tutStart();return;}
  const st=TUT[tut.i];
  if(st.act==='cap'){if(!$('modal').hidden||pending)tutCapSeen=true;else if(tutCapSeen){tutCapSeen=false;tutNext();return;}}

{const today=(()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})();
 const isNewPlayer=!oldSave;let done=false;
 const tm=setInterval(()=>{if(done){clearInterval(tm);return;}if(!S.char||editing||!$('modal').hidden)return;
  // ganz neue Spieler: alte Einträge gelten als gesehen, aber die Änderungen von heute zeigen wir trotzdem nicht (sie kennen das Spiel ja noch nicht)
  const list=isNewPlayer?[]:PATCHES.filter(p=>p.date===today||!S[p.id]);
  done=true;clearInterval(tm);if(!list.length)return;
  const L=(t,x)=>`<li><b>${t}</b> ${x}</li>`,dd=list[list.length-1].date.split('-').reverse().join('.');
  const ws=list.some(p=>p.ws);
  $('card').innerHTML=`<h2>Patch Notes <span style="color:var(--sand)">${list.every(p=>p.date===today)?'heute':dd}</span></h2>
    <div class="pnlist">${list.slice().reverse().map(P=>`<section class="pnsec"><h3>${P.title}${S[P.id]?'':' <em class="pnnew">neu</em>'}</h3>
      <div class="pnhero"><b>${P.hero[0]}</b><span>${P.hero[1]}</span></div>
      <ul class="pn">${P.items().map(([a,b])=>L(a,b)).join('')}</ul></section>`).join('')}</div>
    <div class="row"><button class="btn${ws?'':' go'}" id="pnOk" type="button">${ws?'Schließen':'Alles klar'}</button>${ws?'<button class="btn go" id="pnWs" type="button">Zur Werkstatt</button>':''}</div>`;
  $('modal').hidden=false;
  const seen=()=>{for(const P of list)S[P.id]=true;delete S.v9back;save();};
  $('pnOk').onclick=()=>{seen();$('modal').hidden=true;lastHud='';};
  if($('pnWs'))$('pnWs').onclick=()=>{seen();hqOpen=true;lastHud='';renderWS();};},800);}

// ---------- ×2-Tempo: wird für 30 Minuten durch ein Werbevideo freigeschaltet (zurzeit ein Platzhalter mit 5-s-Countdown) ----------
const X2_MIN=30;
const x2Active=()=>false; // 11.11.2026: ×2-Video entfernt
function renderX2(){const b=$('x2Btn');if(!b)return;const act=x2Active(),on=act&&S.x2On!==false;
  b.setAttribute('aria-pressed',on);b.classList.toggle('locked',!act);
  const left=Math.max(0,((S.x2Until||0)-Date.now())/1000);
  $('x2Sub').textContent=act?(on?'':'aus · ')+Math.floor(left/60)+':'+String(Math.floor(left%60)).padStart(2,'0'):'▶ Video';
  b.title=act?'Doppeltes Kampftempo '+(on?'an':'aus')+' (antippen zum Umschalten)':'Video ansehen: 30 Minuten doppeltes Kampftempo';}
setInterval(renderX2,1000);renderX2();
function showAd(onDone){
  let n=5;
  $('card').innerHTML=`<h2>Werbung</h2><div class="adbox"><span>Hier läuft später ein Werbevideo</span><b id="adN">${n}</b></div>
    <p class="hint" style="margin:0">Danach hast du ${X2_MIN} Minuten doppeltes Kampftempo.</p>
    <div class="row"><button class="btn" id="adX" type="button">Abbrechen</button><button class="btn go" id="adOk" type="button" disabled>Belohnung holen</button></div>`;
  $('modal').hidden=false;
  const tm=setInterval(()=>{n--;const el=$('adN');if(el)el.textContent=Math.max(0,n);
    if(n<=0){clearInterval(tm);const ok=$('adOk');if(ok){ok.disabled=false;ok.focus();}const box=document.querySelector('.adbox');if(box)box.classList.add('done');}},1000);
  $('adX').onclick=()=>{clearInterval(tm);$('modal').hidden=true;lastHud='';};
  $('adOk').onclick=()=>{clearInterval(tm);$('modal').hidden=true;lastHud='';onDone();};
}
$('x2Btn').onclick=()=>{if(!$('modal').hidden||editing)return;
  if(x2Active()){S.x2On=S.x2On===false;save();renderX2();banner={txt:S.x2On?'Doppeltes Tempo an':'Normales Tempo',t:1.2};return;}
  showAd(()=>{S.x2Until=Date.now()+X2_MIN*60000;S.x2On=true;save();renderX2();banner={txt:'×2 Tempo für '+X2_MIN+' Minuten!',t:2};});};

// ---------- Schleife ----------
let last=performance.now();
function gameStep(dt){
  if(!editing&&!offShow&&!(maint.on&&!maint.dev)&&S.char)ptTick(dt);
  if(editing||offShow){t+=dt;drawPreview();}
  else if(maint.on&&!maint.dev){t+=dt;}
  else{gardenTick();autoTick(dt);const sp=x2Active()&&S.x2On!==false?2:1;for(let k=0;k<sp;k++)update(dt);}
}
// Energiesparmodus: das Spiel läuft genauso weiter, wird aber nur ~20-mal pro Sekunde in halber Auflösung gezeichnet,
// mit weniger Partikeln, ohne Wackeln, und die Figur in der Ausrüstung nur 4-mal pro Sekunde
let dollAcc=0;
function loop(now){
  const raw=Math.min(0.25,Math.max(0,(now-last)/1000));last=now;
  if(eco){let r=raw;while(r>1e-4){const d=Math.min(0.05,r);gameStep(d);r-=d;}
    draw();hud();dollAcc+=raw;if(dollAcc>=0.25){dollAcc=0;if(eqOpen)drawEqHero();else drawDoll();}
    setTimeout(()=>requestAnimationFrame(loop),ECO_MS);}
  else{gameStep(Math.min(0.05,raw));draw();hud();if(eqOpen)drawEqHero();else drawDoll();requestAnimationFrame(loop);}
}
requestAnimationFrame(loop);
setInterval(save,5000);
})();
