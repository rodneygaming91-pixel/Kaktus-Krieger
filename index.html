<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1c140f">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Kaktus-Krieger">
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body><title>Kaktus-Krieger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: ein Handy-Hochformat-Spielfeld, mittig, HUD oben, Kampf-Canvas, Infozeile unten. Bewusst nur ein (dunkles Wüstennacht-)Thema. */
:root{
  --night:#1c140f;      /* Hintergrund: dunkler Stein */
  --dusk:#3a2c22;       /* Flächen: Stein */
  --frame:#6b5644;      /* Rahmen */
  --frameD:#221812;     /* Rahmen innen */
  --sand:#f0b866;       /* Münzen, Hervorhebung */
  --cactus:#63c74d;     /* Leben, Spielfigur */
  --bloom:#ff6fae;      /* Akzent, Boss */
  --text:#f4e6cc;
  --muted:#b8a488;
  --display:"Lilita One","Arial Black",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{background:var(--night);color:var(--text);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;box-sizing:border-box;display:flex;justify-content:center;align-items:flex-start;overflow-x:hidden;overflow-y:auto;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.game{width:100%;max-width:520px;display:flex;flex-direction:column;gap:10px;min-height:0}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:1.6rem;margin:0;letter-spacing:.02em;color:var(--cactus);line-height:1}
h1 span{color:var(--bloom)}
.res{display:flex;gap:8px}
.chip{background:var(--dusk);border-radius:999px;padding:6px 12px;font-weight:800;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px;font-size:.95rem}
.chip i{width:12px;height:12px;border-radius:50%;background:var(--sand);box-shadow:inset -2px -2px 0 rgba(0,0,0,.25)}
.stage{display:flex;flex-direction:column;gap:6px}
.stage-top{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.stage-top b{font-family:var(--display);font-weight:400;font-size:1.15rem;letter-spacing:.03em}
.stage-top small{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.bar{height:10px;background:var(--dusk);border-radius:6px;overflow:hidden}
.bar>div{height:100%;width:0;background:var(--sand);transition:width .2s}
.bar.boss>div{background:var(--bloom)}
#cv{width:100%;aspect-ratio:480/300;max-width:100%;border-radius:14px;display:block;background:#241540;image-rendering:auto}
.foot{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;gap:12px;flex-wrap:wrap}
.foot b{color:var(--text);font-variant-numeric:tabular-nums}
.capsule{display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:14px;padding:14px 18px;
  background:var(--cactus);color:var(--night);font-family:var(--display);font-size:1.25rem;letter-spacing:.03em;cursor:pointer;
  box-shadow:0 4px 0 #3e8a2f;transition:transform .08s}
.capsule:active{transform:translateY(3px);box-shadow:0 1px 0 #3e8a2f}
.capsule:disabled{background:var(--dusk);color:var(--muted);box-shadow:0 4px 0 #120b24;cursor:default}
.capsule:focus-visible,.btn:focus-visible{outline:3px solid var(--sand);outline-offset:2px}
.capsule .n{background:var(--night);color:var(--sand);border-radius:999px;padding:2px 10px;font-family:var(--body);font-weight:800;font-size:.95rem}
.actions{display:flex;gap:8px}
.actions{display:grid;grid-template-columns:repeat(3,1fr)}
.actions .garden{min-width:0;padding:7px 6px}
.hqmap{width:100%;aspect-ratio:320/200;max-width:100%;border-radius:8px;border:3px solid #6b5644;box-shadow:inset 0 0 0 2px #221812;display:block}
.wsbank{display:flex;justify-content:space-between;gap:8px;background:var(--night);border:2px solid #6b5644;border-radius:8px;padding:6px 10px;font-weight:800;font-variant-numeric:tabular-nums}
.wsbank b{color:#ffd447}.wsbank span:first-child b{color:#7fe08a}.wsbank i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;background:radial-gradient(circle at 35% 35%,#fff2a8,#e0a800 55%,#8a6200);border:1.5px solid #5a3e00;vertical-align:-1px}
.wsb{display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:86px}.wsb small{font-size:.68rem;color:inherit;opacity:.9}
.chip.kak{color:#7fe08a}.chip.kak b{font-size:.85rem}
.blist{display:flex;flex-direction:column;gap:6px;text-align:left}
.brow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--night);border-radius:8px;padding:9px 10px;border:2px solid #6b5644;border-left:5px solid var(--bc);box-shadow:inset 0 0 10px #0008}
.brow div{min-width:0;display:flex;flex-direction:column;gap:1px}
.brow b{font-size:.92rem}.brow b em{font-style:normal;color:var(--sand);font-size:.78rem;margin-left:4px}
.brow small{color:var(--muted);font-size:.74rem;font-variant-numeric:tabular-nums}
.brow .btn{flex:none;padding:8px 10px;font-size:.8rem}
/* Ausrüstungs-Fenster: Stein- und Holzrahmen wie im Konzeptbild */
.gearbtn{border:0;background:none;padding:0;color:inherit;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left}
.gearbtn:focus-visible{outline:3px solid var(--sand);outline-offset:3px;border-radius:12px}
.gh{display:flex;justify-content:space-between;align-items:baseline}
.gh b{font-family:var(--display);font-weight:400;font-size:1.05rem;letter-spacing:.03em}
.gh small{color:var(--sand);font-weight:800;font-size:.8rem}
.gear{width:100%}
.card.wide{max-width:560px;padding:0;background:none;border:0;box-shadow:none;gap:0}
.eqwin{--st:#4a3a2e;--stl:#6b5644;--std:#221812;--gd:#d9a441;
  background:radial-gradient(ellipse at 50% 30%,#4f3d30,#33261d);border:4px solid var(--stl);border-radius:10px;
  box-shadow:inset 0 0 0 3px var(--std),inset 0 0 40px #0006,0 10px 30px #000a;padding:12px;display:flex;flex-direction:column;gap:10px;color:#f4e6cc;text-align:left}
.eqbar{display:flex;flex-wrap:wrap;gap:4px;background:var(--std);border:2px solid var(--stl);border-radius:6px;padding:5px}
.eqbar span{flex:1 1 auto;display:flex;align-items:center;justify-content:center;gap:4px;font-size:.68rem;font-weight:800;padding:4px 6px;border-radius:4px;
  background:color-mix(in srgb,var(--rc) 22%,#1a120d);border:1px solid color-mix(in srgb,var(--rc) 55%,#1a120d);color:#f4e6cc}
.eqbar span i{width:7px;height:7px;transform:rotate(45deg);background:var(--rc);box-shadow:0 0 6px var(--rc)}
.eqbar span.lock{opacity:.4}
.eqgrid{display:grid;grid-template-columns:62px 1fr 62px;gap:8px;align-items:start}
.eqcol{display:flex;flex-direction:column;gap:6px}
.eqslot,.invc{position:relative;aspect-ratio:1;border-radius:6px;cursor:pointer;padding:0;display:grid;place-items:center;
  background:linear-gradient(#2c211a,#1e1611);border:3px solid var(--stl);box-shadow:inset 0 0 0 2px var(--std),inset 0 0 14px color-mix(in srgb,var(--rc) 35%,transparent),0 2px 0 #120c08}
.eqslot{margin-top:10px}
.eqslot canvas,.invc canvas{width:86%;height:86%}
.eqslot i{font-style:normal;color:#8a7258;font-weight:800;font-size:1.3rem}
.eqslot .lbl{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--std);border:1px solid var(--stl);border-radius:4px;
  padding:1px 5px;font-size:.6rem;font-weight:800;color:#f4e6cc;white-space:nowrap}
.eqslot.sel,.invc.sel{border-color:var(--gd);box-shadow:inset 0 0 0 2px var(--std),0 0 0 2px var(--gd),inset 0 0 14px color-mix(in srgb,var(--rc) 45%,transparent)}
.eqslot:focus-visible,.invc:focus-visible,.sbtn:focus-visible{outline:3px solid var(--gd);outline-offset:2px}
.eqhero{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.eqhero canvas{width:100%;max-width:240px;aspect-ratio:360/460;background:radial-gradient(ellipse at 50% 60%,#6b5644aa,transparent 70%)}
.eqstats{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;font-weight:800;font-size:.78rem;font-variant-numeric:tabular-nums;color:#f4e6cc}
.eqd{display:grid;grid-template-columns:56px 1fr;gap:4px 10px;align-items:center;background:var(--std);border:2px solid var(--rc);border-radius:8px;padding:8px}
.eqd canvas{width:56px;height:56px}
.eqd>div{display:flex;flex-direction:column;gap:1px;min-width:0}
.eqd b{font-family:var(--display);font-weight:400;font-size:1.1rem;letter-spacing:.02em}
.eqd span{font-weight:800;font-size:.85rem}.eqd em{font-style:normal}
.eqdb{grid-column:1/-1;display:flex;gap:6px}
.hint{margin:0;color:#b8a488;font-size:.82rem;text-align:center}
.invhead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--stl);padding-bottom:3px}
.invhead span{font-family:var(--display);letter-spacing:.03em}.invhead small{color:#b8a488;font-weight:800}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;max-height:160px;overflow-y:auto;padding:2px}
.inv .hint{grid-column:1/-1}
.eqfoot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gold{display:flex;align-items:center;margin-right:auto;font-family:var(--display);font-size:1.25rem;color:#ffd447;text-shadow:0 2px 0 #000}
.gold i{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff2a8,#e0a800 55%,#8a6200);border:1.5px solid #5a3e00;margin-right:-6px}
.gold b{font-weight:400;margin-left:12px;font-variant-numeric:tabular-nums}
.sbtn{flex:1;border:2px solid #2a1a0e;border-radius:8px;padding:9px 10px;font-family:var(--display);font-size:.95rem;letter-spacing:.03em;cursor:pointer;color:#fff6e0;
  background:linear-gradient(#c58a3a,#8a5520);box-shadow:inset 0 2px 0 #ffffff40,inset 0 -3px 0 #00000040,0 2px 0 #120c08;text-shadow:0 1px 0 #0008}
.sbtn.go{background:linear-gradient(#6fcf3f,#3a8a1f)}
.sbtn.red{background:linear-gradient(#c8553a,#8a2a18)}
.sbtn.wide{flex:none;width:100%;background:linear-gradient(#5a4636,#3a2c22)}
.sbtn:disabled{opacity:.45;cursor:default}
.eqfoot .sbtn{flex:0 1 auto}
.eqtabs{display:flex;gap:4px;border-bottom:3px solid var(--stl);margin:-2px -2px 0}
.eqtabs button{flex:1;border:2px solid var(--stl);border-bottom:0;border-radius:8px 8px 0 0;background:linear-gradient(#33261d,#241a14);color:#b8a488;
  font-family:var(--display);font-size:1rem;letter-spacing:.03em;padding:8px;cursor:pointer}
.eqtabs button[aria-selected="true"]{background:linear-gradient(#6b5644,#4a3a2e);color:#ffe7a8;text-shadow:0 2px 0 #0009}
.eqtabs button:focus-visible{outline:3px solid var(--gd);outline-offset:-3px}
.blds{display:flex;flex-direction:column;gap:10px}
.bld{background:var(--std);border:3px solid var(--stl);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 0 14px #0008}
.bld.act{border-color:var(--gd);box-shadow:inset 0 0 14px #0008,0 0 10px #d9a44155}
.bldh{display:flex;align-items:center;gap:8px}
.bldh input{flex:1;min-width:0;background:#1a120d;border:2px solid var(--stl);border-radius:5px;color:#ffe7a8;font-family:var(--display);font-size:1.05rem;letter-spacing:.02em;padding:5px 8px}
.bldh input:focus{outline:none;border-color:var(--gd)}
.tag{background:linear-gradient(#ffd447,#c98a10);color:#2a1a0e;font-weight:800;font-size:.7rem;border-radius:4px;padding:2px 7px;text-transform:uppercase;letter-spacing:.06em}
.bldi{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
.bs{aspect-ratio:1;border:2px solid var(--rc);border-radius:4px;background:#1a120d;display:grid;place-items:center;min-width:0}
.bs canvas{width:90%;height:90%}.bs em{font-style:normal;color:#ff8a7a;font-weight:800;font-size:.8rem}
.hint.warn{color:#ff9a7a}
.invtools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:2px solid var(--stl);border-radius:8px;overflow:hidden;flex:1;min-width:200px}
.seg button{flex:1;background:#3a2c20;color:#d8c6a8;border:0;border-right:2px solid var(--stl);font:inherit;font-size:.78rem;font-weight:800;padding:6px 4px;cursor:pointer}
.seg button:last-child{border-right:0}.seg button[aria-pressed="true"]{background:var(--gd);color:#2a1d10}
#invFilter{background:#3a2c20;color:#f3e6cc;border:2px solid var(--stl);border-radius:8px;font:inherit;font-size:.78rem;font-weight:800;padding:5px 6px;flex:1;min-width:120px}
.pickbtn{flex:0 0 auto}.pickbtn.on{background:var(--gd);color:#2a1d10}
.pickbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#2a1f16;border:2px solid var(--stl);border-radius:8px;padding:6px}
.pickbar span{color:#f3e6cc;font-weight:800;font-size:.85rem;margin-right:auto}
.invc.mk{border-color:#ff6b5e;box-shadow:inset 0 0 0 2px var(--std),0 0 0 2px #ff6b5e}.invc.mk canvas{opacity:.55}
.invc .mkx{position:absolute;top:1px;left:3px;background:#ff6b5e;color:#fff;border-radius:50%;width:16px;height:16px;font-size:.62rem;display:grid;place-items:center;box-shadow:0 1px 0 #000}
.invc .upm{position:absolute;bottom:0;left:3px;color:#7fe08a;font-size:.65rem;text-shadow:0 1px 0 #000,0 0 3px #000}
.invc .star{position:absolute;top:1px;right:3px;color:#ffd447;font-size:.7rem;text-shadow:0 1px 0 #000}
.elinfo{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.78rem;font-weight:800;color:var(--muted)}
.elinfo .you{flex-basis:100%;color:var(--text)}
.elt{color:var(--ec);font-weight:800;white-space:nowrap;text-shadow:0 1px 0 #0008}
.ex{display:block;font-size:.8rem;font-weight:800}.ex em{font-style:normal}
.eld{position:absolute;bottom:2px;right:3px;color:var(--ec);font-size:.75rem;text-shadow:0 1px 0 #000;line-height:1}
.bsum{margin:0;font-size:.76rem;font-weight:800;color:var(--muted)}
.offres{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.offres div{background:var(--night);border:2px solid #6b5644;border-radius:8px;padding:10px 6px;display:flex;flex-direction:column;gap:2px}
.offres small{color:var(--muted);font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;font-weight:800}
.offres b{font-family:var(--display);font-weight:400;font-size:1.35rem;font-variant-numeric:tabular-nums}
.dlist{display:flex;flex-direction:column;gap:8px;text-align:left}
.drow{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;background:var(--night);border-radius:8px;padding:8px;border:2px solid #6b5644;box-shadow:inset 0 0 10px #0008}
.drow.eq{border-color:var(--dc)}
.drow canvas{width:48px;height:48px}
.drow div{min-width:0;display:flex;flex-direction:column;gap:1px}
.drow b{font-size:.95rem}.drow b em{font-style:normal;color:var(--sand);font-size:.8rem;margin-left:4px}
.drow small{color:var(--muted);font-size:.72rem;line-height:1.3}
.drow .bon{color:var(--dc);font-weight:800;font-size:.74rem}
.dbtns{display:flex;flex-direction:column;gap:4px}
.dbtns .btn{padding:7px 10px;font-size:.8rem;flex:none}
.dbtns .btn.go{background:var(--cactus)}
.garden{border:0;border-radius:14px;background:var(--dusk);color:var(--text);padding:6px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:96px;font-family:var(--body);box-shadow:0 4px 0 #120b24}
.garden small{color:var(--muted);font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.garden b{font-family:var(--display);font-weight:400;font-size:1.15rem;color:var(--sand);line-height:1.1}
.garden span{font-size:.72rem;font-weight:800;font-variant-numeric:tabular-nums}
.garden.ready span{color:var(--cactus)}
.garden:focus-visible{outline:3px solid var(--sand);outline-offset:2px}
.odds{display:flex;flex-direction:column;gap:6px;text-align:left}
.odd{display:grid;grid-template-columns:7.5em 1fr 3.2em 3.6em;align-items:center;gap:8px;font-weight:800;font-size:.85rem;font-variant-numeric:tabular-nums}
.odd .track{height:9px;background:var(--night);border:1px solid #6b5644;border-radius:3px;overflow:hidden}
.odd .track div{height:100%}
.odd em{font-style:normal;text-align:right}
.odd .nx{color:var(--muted);text-align:right;font-size:.78rem}
.odd.lock{opacity:.45}
.prog{height:12px;background:var(--night);border:2px solid #6b5644;border-radius:4px;overflow:hidden}
.prog div{height:100%;background:var(--cactus)}
.btn:disabled{opacity:.5;cursor:default}
.res{align-items:center}
.who{border:0;background:none;color:var(--text);font-family:var(--body);cursor:pointer;display:flex;flex-direction:column;align-items:flex-end;line-height:1.1;padding:2px 4px;border-radius:8px}
.who b{font-size:.9rem}.who small{font-size:.68rem;color:var(--muted);font-weight:800}
.who:focus-visible{outline:3px solid var(--sand)}
.card{max-height:calc(100% - 24px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.pv{width:100%;max-width:320px;aspect-ratio:320/220;margin:0 auto;background:radial-gradient(ellipse at 50% 75%,#6b5644,#221812);border:3px solid #6b5644;box-shadow:inset 0 0 0 2px #221812;border-radius:8px;display:block}
.fld,.opt{display:flex;flex-direction:column;gap:6px;text-align:left}
.fld small,.opt small{color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.fld input{background:var(--night);border:2px solid #6b5644;border-radius:6px;color:var(--text);font-family:var(--body);font-weight:800;font-size:1rem;padding:9px 12px}
.fld input:focus{outline:none;border-color:var(--sand)}
.opt>div{display:flex;flex-wrap:wrap;gap:6px}
.chip2{border:2px solid #6b5644;background:var(--night);color:var(--text);border-radius:999px;padding:6px 12px;font-family:var(--body);font-weight:800;font-size:.82rem;cursor:pointer}
.chip2.on{border-color:var(--cactus);color:var(--cactus)}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid var(--night);cursor:pointer}
.sw.on{box-shadow:0 0 0 3px var(--sand)}
.chip2:focus-visible,.sw:focus-visible,.clsc:focus-visible{outline:3px solid var(--sand);outline-offset:2px}
.cls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.clsc{border:2px solid #6b5644;background:var(--night);color:var(--text);border-radius:8px;padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;font-family:var(--body);min-width:0}
.clsc.on{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 14%,var(--night))}
.clsc .role{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em}
.clsc b{font-family:var(--display);font-weight:400;font-size:1.05rem;letter-spacing:.02em}
.clsc small{color:var(--muted);font-size:.74rem;line-height:1.3}
.pc{display:flex;flex-direction:column;gap:1px;margin-top:4px}
.pc em{font-style:normal;font-size:.74rem;font-weight:800}
.mods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mod{--p:0;--c:var(--cactus);border:0;border-radius:12px;background:var(--dusk);color:var(--text);padding:8px;cursor:pointer;display:flex;align-items:center;gap:8px;font-family:var(--body);text-align:left;min-width:0}
.mod .ring{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:1.1rem;
  background:conic-gradient(var(--c) calc(var(--p)*1turn),var(--night) 0)}
.mod .ring span{width:28px;height:28px;border-radius:50%;background:var(--dusk);display:grid;place-items:center}
.mod div{min-width:0;display:flex;flex-direction:column}

function update(dt){

    const ex=e.x,ey=e.y-(e.ty.r);const dx=ex-p.x,dy=ey-p.y,d=Math.hypot(dx,dy);
    if(d<10){p.dead=true;const hs=heroStats(),cr=p.dmg==null&&Math.random()<hs.crit/100;hitEnemy(e,p.dmg!=null?p.dmg:hs.atk*rnd(.9,1.1)*(cr?2:1),cr);if(p.stun&&!e.dying)e.stun=Math.max(e.stun||0,p.stun);}
    else{p.x+=dx/d*p.v*dt;p.y+=dy/d*p.v*dt;p.a=Math.atan2(dy,dx);}
  }
  spines=spines.filter(p=>!p.dead);
  // Gegner laufen und greifen an
  for(const e of enemies){
    e.hit=Math.max(0,e.hit-dt*5);

    if(e.stun>0){e.stun-=dt;continue;}
    const stop=HX+28+e.ty.r+(S.drEq.length?14+S.drEq.length*27:0);
    if(e.x>stop)e.x-=e.ty.sp*dt*(engaged?1:1.6);
    else{e.atkT-=dt;if(e.atkT<=0){e.atkT=1.3;hurtHero(e.atk);e.lunge=1;}}
    e.lunge=Math.max(0,(e.lunge||0)-dt*4);
  }
  enemies=enemies.filter(e=>!e.dying||e.dying>0);
  if(boss){bossT-=dt;if(bossT<=0){failBoss('Zeit abgelaufen');}}

  {const s=heroStats();if(hero.max!==s.hp){hero.hp+=Math.max(0,s.hp-hero.max);hero.max=s.hp;}
   hero.hp=Math.min(hero.max,hero.hp+hero.max*s.reg/100*dt);} // Selbstheilung über Wurzeln
  for(const fl of floats){fl.y-=30*dt;fl.t-=dt;}floats=floats.filter(f=>f.t>0);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;p.t-=dt;}parts=parts.filter(p=>p.t>0);
  // Hunde laufen vorneweg, springen den vordersten Gegner an und kommen zurück
  S.drEq.forEach((id,i)=>{const D=DRONES.find(d=>d.id===id),o=S.dr[id];if(!D||!o)return;
    const st=dogSt[id]||(dogSt[id]={j:0,hit:false,tx:0});if(st.j>0){st.j=Math.max(0,st.j-dt/.45);
      if(!st.hit&&st.j<.5){st.hit=true;const e=st.e;if(e&&!e.dying){hitEnemy(e,heroStats().atk*D.dmg*drScale(o.lv));if(D.act==='stun'&&!e.dying)e.stun=Math.max(e.stun||0,.6);}}}
    drT[id]=(drT[id]??rnd(0,D.every))-dt;
    if(drT[id]>0||!f)return;
    const pos=dogPos(i);
    if(D.act==='heal'){if(hero.hp>=hero.max)return;drT[id]=D.every;const h=hero.max*D.heal/100*drScale(o.lv);
      hero.hp=Math.min(hero.max,hero.hp+h);floats.push({x:pos.x,y:pos.y-26,txt:'♥ +'+fmt(h),col:'#ff8ac0',t:.8});return;}
    if(!engaged||f.x>W-10)return;
    drT[id]=D.every;st.j=1;st.hit=false;st.e=f;st.tx=f.x-f.ty.r-pos.x;
  });
  // Module laden auf und zünden automatisch, wenn gekämpft wird
  haste=Math.max(0,haste-dt);
  for(const m of MODS){if(S.best<m.unlock)continue;modCd[m.id]=Math.max(0,modCd[m.id]-dt);
    if(modCd[m.id]<=0&&engaged&&S.modAuto!==false)castMod(m);}
  for(const x of fx){x.t-=dt;if(x.kind==='drop'){x.y+=x.v*dt;if(!x.done&&x.y>=x.ty){x.done=true;x.t=Math.min(x.t,.15);}}}
  fx=fx.filter(x=>x.t>0);
  shake=Math.max(0,shake-dt*20);
  if(banner){banner.t-=dt;if(banner.t<=0)banner=null;}
}
function hitEnemy(e,dmg,crit){
  const em=elMul();dmg*=em;
  e.hp-=dmg;e.hit=1;floats.push({x:e.x,y:e.y-e.ty.r*2-6,txt:fmt(dmg)+(crit?'!':''),col:crit?'#ffd447':em>1?ELEM[world().weak].c:em<1?'#9a8f88':'#fff',t:crit?.9:.7});
  if(e.hp<=0){
    S.tk=(S.tk||0)+1; // alle Kills zählen fürs Gilden-Wochenziel
    const gain=Math.ceil(e.coin*coinMul());
    e.dying=.35;S.coins+=gain;floats.push({x:e.x,y:e.y-e.ty.r*2-20,txt:'+'+fmt(gain),col:'#f0b866',t:1});
    for(let i=0;i<(eco?3:10);i++)parts.push({x:e.x,y:e.y-e.ty.r,vx:rnd(-120,120),vy:rnd(-220,-60),t:rnd(.3,.6),col:e.ty.col});
    if(e.boss){boss=false;const kk=kakFor(S.stage);S.kak=(S.kak||0)+kk;floats.push({x:e.x,y:e.y-60,txt:'+'+kk+' 🌵',col:'#7fe08a',t:1.4});const firstTime=S.stage+1>S.best;S.stage++;S.kills=0;S.best=Math.max(S.best,S.stage);S.caps+=3;const nd=diffIdx(S.stage)>diffIdx(S.stage-1),nw=!nd&&(S.stage-1)%STAGES_PER_WORLD===0&&worldIdx(S.stage)>worldIdx(S.stage-1);banner={txt:nd?diffOf(S.stage).n+(firstTime?' freigeschaltet!':'!'):nw?'Neue Welt: '+world().n+' ('+ELEM[world().atkEl].n+')':'Stage geschafft! +3 Kapseln · +'+kk+' Kakteen',t:nd?3.5:nw?3:2.2};shake=nd?10:6;}
    else if(!boss){S.kills=Math.min(KILL_GOAL,S.kills+1);if(S.kills>=KILL_GOAL&&S.bossAuto!==false)startBoss();}
    if(!e.boss&&Math.random()<0.12){S.caps++;floats.push({x:e.x,y:e.y-e.ty.r*2-34,txt:'+1 Kapsel',col:'#63c74d',t:1.1});}
    save();
  }
}
function castMod(m){
  if(modCd[m.id]>0||S.best<m.unlock)return;
  const targets=alive().filter(e=>e.x<W+10);
  if(m.id!=='sonne'&&!targets.length)return;
  const cm=clsM();modCd[m.id]=m.cd*cm.cd;const atk=heroStats().atk*cm.mod;
  if(m.id==='regen'){
    for(const e of targets)for(let i=0;i<5;i++)fx.push({kind:'drop',x:e.x+rnd(-14,14),y:-rnd(0,80),ty:e.y-e.ty.r,v:520,t:1.2});
    setTimeout(()=>{for(const e of targets)if(!e.dying)hitEnemy(e,atk*2.5);shake=Math.max(shake,3);},350);
  }else if(m.id==='sonne'){
    const h=hero.max*.25*cm.heal;hero.hp=Math.min(hero.max,hero.hp+h);haste=4;
    fx.push({kind:'sun',t:.8});floats.push({x:HX,y:GROUND-96,txt:'+'+fmt(h),col:'#63c74d',t:.9});
  }else{
    for(const e of targets){hitEnemy(e,atk);if(!e.dying)e.stun=2;fx.push({kind:'root',e,t:2});}
  }
  floats.push({x:HX+4,y:GROUND-108,txt:m.n+'!',col:m.c,t:1});
}
function hurtHero(dmg){
  const hs=heroStats();dmg*=(1-hs.block/100)*(1-hs.armor/100)*(1-(hs.res[world().atkEl]||0)/100);
  hero.hp-=dmg;hero.hit=1;shake=Math.max(shake,2);
  floats.push({x:HX,y:GROUND-70,txt:'-'+fmt(dmg),col:'#ff6fae',t:.7});
  if(hero.hp<=0){if(boss)failBoss('Verloren');else{resetHero();enemies=[];if(S.stage>1){S.stage--;S.kills=0;save();lastHud='';banner={txt:'Zu stark! Zurück zu '+stageName(S.stage),t:2.2};}else banner={txt:'Neuer Versuch',t:1.5};}}
}
function failBoss(why){boss=false;enemies=[];S.kills=S.bossAuto===false?KILL_GOAL:Math.floor(KILL_GOAL*0.6);resetHero();banner={txt:why+', stärker werden!',t:2.2};save();}

function wbAttack(){if(wb.busy||!wb.st||wb.st.day_left<=0)return;
  const B=wbBoss(wb.st.period),L=wbLevel(+wb.st.total),st=heroStats(),em=wbElMul(B),dps=wbDamage(B)/30;
  const res=(st.res[B.atkEl]||0)/100,blk=st.block/100,bossHit=st.hp*(0.075+0.02*(L.l-1))*(1-blk)*(1-(st.armor||0)/100)*(1-res);
  wb.busy=true;wb.res=null;
  wb.anim={left:30,dmg:0,php:st.hp,pmax:st.hp,bhp:L.hp-L.rest,bmax:L.hp,sp:[],orbs:[],fl:[],bhit:0,phit:0,sq:0,lunge:0,end:null,endT:0,
    throwT:0,bossT:1.2,reg:st.hp*st.reg/100};
  renderOnline();
  let last=performance.now();
  const step=now=>{const dt=Math.min(.05,(now-last)/1000);last=now;const A=wb.anim;if(!A)return;
    if(!A.end){
      A.left-=dt;A.php=Math.min(A.pmax,A.php+A.reg*dt);
      // Kaktus wirft: Schaden pro Wurf aus der Gesamtleistung (Angriff, Krit, Drohnen, Module, Element)
      A.throwT-=dt;if(A.throwT<=0){A.throwT=.25;A.sq=1;A.sp.push({x:92,y:130+rnd(-8,8)});}
      A.sq=Math.max(0,A.sq-dt*6);
      for(const s2 of A.sp){s2.x+=520*dt;if(s2.x>240&&!s2.done){s2.done=true;const cr=Math.random()<st.crit/100,v=dps*.25*rnd(.85,1.15)*(cr?2:1);
        A.dmg+=v;A.bhp-=v;A.bhit=.1;A.fl.push({x:265+rnd(-22,22),y:105+rnd(-18,8),txt:fmt(v)+(cr?'!':''),c:cr?'#ffd447':em>1?ELEM[B.weak].c:'#fff',t:.7});}}
      A.sp=A.sp.filter(s2=>!s2.done);
      // Boss greift an
      A.bossT-=dt;if(A.bossT<=0){A.bossT=1.5;A.lunge=1;A.orbs.push({x:240,y:140});}
      A.lunge=Math.max(0,A.lunge-dt*3);
      for(const o of A.orbs){o.x-=300*dt;if(o.x<95&&!o.done){o.done=true;const v=bossHit*rnd(.9,1.1);A.php-=v;A.phit=.15;
        A.fl.push({x:70,y:70,txt:'-'+fmt(v),c:'#ff8a7a',t:.7});}}
      A.orbs=A.orbs.filter(o=>!o.done);
      if(A.bhp<=0){A.end='boss';A.bhp=0;}else if(A.php<=0){A.end='dead';A.php=0;}else if(A.left<=0){A.end='time';A.left=0;}
    }else A.endT+=dt;
    A.bhit=Math.max(0,A.bhit-dt);A.phit=Math.max(0,A.phit-dt);for(const f of A.fl){f.y-=30*dt;f.t-=dt;}A.fl=A.fl.filter(f=>f.t>0);
    drawWb();
    const alive=olOpen&&olTab==='boss'&&$('wbcv');
    if(alive&&!(A.end&&A.endT>1.6))requestAnimationFrame(step);else finish(A);};
  const finish=async A=>{const total=Math.round(A.dmg),why=A.end==='boss'?'Boss besiegt!':A.end==='dead'?'Du bist gefallen.':A.end==='time'?'Zeit abgelaufen.':'Kampf abgebrochen.';
    try{const r=await rpc('kk_wb_hit',{p_code:ON.code,p_key:ON.key,p_dmg:total});
      if(r&&r.ok){const bonus=A.end==='boss'?3:0,caps=Math.min(10,2+bonus+Math.floor(Math.log10(r.added+1)/2)),coins=Math.round(r.added*.25*(A.end==='boss'?1.5:1));
        S.caps+=caps;S.coins+=coins;save();lastHud='';
        wb.res=`<b>${why}</b> ${fmt(r.added)} Schaden · Belohnung: <em class="up">+${caps} Kapseln</em> · <em class="up">+${fmt(coins)} Münzen</em>${A.end==='dead'?'<br><small>Tipp: Mehr Leben, Schild oder '+ELEM[B.atkEl].n+'-Resistenz helfen.</small>':''}`;}
      else wb.res=`<span class="down">${(r&&r.reason)||'Angriff nicht gezählt'}</span>`;}
    catch(e){wb.res='<span class="down">Keine Verbindung, Angriff nicht gezählt.</span>';}
    wb.busy=false;wb.anim=null;await loadWb();};
  requestAnimationFrame(step);}

    catch(e){gd.msg='Keine Verbindung.';}

  if(q('gchat')){const box=q('gchat');box.scrollTop=box.scrollHeight;if(chat.msgs.length){chat.seen=chat.last;chat.unread=0;try{localStorage.setItem('kk-chat-seen',chat.seen);}catch(e){}}}
  if(q('gSend')){const send=async()=>{const inp=q('gMsg'),tx=inp.value.trim();if(!tx)return;q('gSend').disabled=true;
      try{const r=await rpc('kk_guild_say',{p_code:ON.code,p_key:ON.key,p_text:tx});

  $('card').querySelectorAll('[data-don]').forEach(b=>b.onclick=()=>{const a=Math.floor(+b.dataset.don);if(a<1||S.coins<a)return;

// ---------- Arena: Kämpfe gegen andere Spieler (der Server entscheidet) ----------
const LEAGUES=[{n:'Bronze',min:0,c:'#cd8a4a'},{n:'Silber',min:1100,c:'#c8d0e0'},{n:'Gold',min:1250,c:'#ffd447'},{n:'Platin',min:1450,c:'#5fe0d0'},{n:'Diamant',min:1700,c:'#b48cff'}];
const leagueOf=p=>LEAGUES.filter(L=>p>=L.min).pop();
let ar={open:false,st:null,opp:null,err:'',msg:'',fight:null,res:null};
const arStats=()=>{const s=heroStats();return{atk:Math.round(s.atk*100)/100,hp:s.hp,spd:Math.round(s.spd*1000)/1000,block:s.block,crit:s.crit};};
const BOTN=['Trainings-Kaktus','Übungs-Säule','Sandsack-Kaktus','Holzkaktus','Strohkaktus'];
function makeBots(n,pts){const me=arStats(),out=[];for(let i=0;i<n;i++){const f=rnd(.75,1.15),G={};
    for(const sl of SLOTS)if(Math.random()<.7)G[sl.id]={slot:sl.id,r:Math.max(0,Math.min(5,Math.round(rnd(0,3)))),name:''};
    out.push({code:'BOT',bot:true,name:BOTN[i%BOTN.length],cls:'Training',pts:Math.round(pts+rnd(-60,60)),power:Math.round(powerNow()*f),
      stats:{atk:me.atk*f,hp:Math.round(me.hp*f),spd:me.spd,block:Math.min(40,me.block*f),crit:Math.min(30,me.crit*f)},
      card:{char:{name:'',shape:pick(SHAPES),color:COLORS[Math.floor(Math.random()*COLORS.length)][1],eyes:pick(EYES),hat:pick(HATS),cls:'schuetze'},gear:G}});}
  return out;}
// Tagesrangliste der Arena: heute gewonnene Punkte, Platz 1–3 bekommen am nächsten Tag Kakteen und Samenkapseln
const AR_PRIZE=[null,{kak:30,caps:20,n:'🥇'},{kak:20,caps:12,n:'🥈'},{kak:10,caps:8,n:'🥉'}];
function arDayHtml(){const D=ar.day;
  const nx=new Date();nx.setHours(24,0,0,0);const left=(nx-Date.now())/1000,hh=Math.floor(left/3600),mm=Math.floor(left%3600/60);
  const prizes=`<div class="twprz">${[1,2,3].map(r=>`<span>${AR_PRIZE[r].n} ${AR_PRIZE[r].kak} 🌵 · ${AR_PRIZE[r].caps} Samenkapseln</span>`).join('')}</div>`;
  if(!D)return`<div class="twrank"><div class="twrh"><b>🏆 Tagesrangliste</b></div>${prizes}<p class="hint" style="margin:0">Lade …</p></div>`;
  const me=D.me,pz=D.prize;
  return`<div class="twrank"><div class="twrh"><b>🏆 Tagesrangliste</b><span>neu in ${hh} h ${String(mm).padStart(2,'0')} min</span></div>
    ${pz?`<div class="twclaim"><span>${AR_PRIZE[pz.rk].n} Gestern Platz ${pz.rk} mit +${pz.pts} Punkten!</span><button class="sbtn go" type="button" id="arClaim" ${ar.claimBusy?'disabled':''}>Preis abholen</button></div>`:''}
    ${ar.dayMsg?`<p class="hint" style="margin:0">${ar.dayMsg}</p>`:''}
    <p class="hint" style="margin:0">Gewertet werden die Punkte, die du <b>heute</b> in der Arena gewinnst.</p>
    ${prizes}
    ${D.top.length?`<ol class="lb twlb">${D.top.map(r=>`<li class="${r.code===ON.code?'me':''}${r.rk<=3?' top':''}"><button type="button" data-afc="${r.code}">
      <span class="rk">${r.rk===1?'🥇':r.rk===2?'🥈':r.rk===3?'🥉':r.rk}</span><span class="nm"><b>${esc2(r.name)}</b><small>${esc2(r.cls||'')}</small></span><span class="vl">+${r.pts}</span></button></li>`).join('')}</ol>`
      :'<p class="hint" style="margin:0">Heute hat noch niemand Punkte gewonnen. Sei der Erste!</p>'}
    <p class="hint" style="margin:0">${me?`Dein Platz heute: <b>${me.rk}</b> von ${D.players} (+${me.pts} Punkte)`:`Deine Punkte heute: ${D.mine>0?'+':''}${D.mine}`}</p>
    ${D.yesterday&&D.yesterday.length?`<p class="hint" style="margin:0">Gestern: ${D.yesterday.map(y=>`${AR_PRIZE[y.rk].n} ${esc2(y.name)} (+${y.pts})`).join(' · ')}</p>`:''}
  </div>`;}
async function arClaim(){if(ar.claimBusy)return;ar.claimBusy=true;renderArena();
  try{const r=await rpc('kk_ar_claim',{p_code:ON.code,p_key:ON.key});
    if(r&&r.ok){const P=AR_PRIZE[r.rk];S.kak=(S.kak||0)+P.kak;S.caps+=P.caps;save();lastHud='';ar.dayMsg=`${P.n} <b>Preis abgeholt:</b> <em class="up">+${P.kak} 🌵</em> · <em class="up">+${P.caps} Samenkapseln</em>`;}
    else ar.dayMsg=(r&&r.reason)||'Kein Preis abzuholen';}
  catch(e){ar.dayMsg='Keine Verbindung.';}
  ar.claimBusy=false;try{ar.day=await rpc('kk_ar_day',{p_code:ON.code||null});}catch(e){}if(ar.open)renderArena();}
async function loadArena(){ar.err='';try{
    if(ON.code&&ON.key)await rpc('kk_ar_update',{p_code:ON.code,p_key:ON.key,p_stats:arStats()});
    ar.st=await rpc('kk_ar_status',{p_code:ON.code});
    try{ar.day=await rpc('kk_ar_day',{p_code:ON.code||null});}catch(e){ar.day=null;}
    const real=await rpc('kk_ar_opponents',{p_code:ON.code})||[];
    ar.opp=real.concat(makeBots(Math.max(0,3-real.length),(ar.st&&ar.st.me&&ar.st.me.pts)||1000));}
  catch(e){ar.err='Keine Verbindung. Die Arena gibt es nur auf kaktus-krieger.pages.dev.';}
  if(ar.open)renderArena();}
function renderArena(){
  let body;
  if(ar.err)body=`<p class="hint warn">${ar.err}</p>`;
  else if(!ar.st||!ar.opp)body='<p class="hint">Lade Arena …</p>';
  else{const me=ar.st.me||{pts:1000,win:0,loss:0,tickets:5},L=leagueOf(me.pts),nx=LEAGUES[LEAGUES.indexOf(L)+1];
    body=`<div class="arhead" style="--lc:${L.c}"><span class="lg">${L.n}</span><div><b>${me.pts} Punkte</b><small>${me.win} Siege · ${me.loss} Niederlagen${nx?' · noch '+(nx.min-me.pts)+' bis '+nx.n:''}</small></div>
        <span class="tk">${me.tickets}/5<small>Kämpfe heute</small></span></div>
      ${ar.fight?'<canvas id="arcv" width="720" height="380"></canvas>':''}

async function arFight(o){if(ar.fight)return;ar.msg='';ar.res=null;

  if(!r||!r.ok){ar.msg=(r&&r.reason)||'Kampf nicht möglich';renderArena();return;}
  // Animation: die Zeiten vom Server bestimmen, wer zuerst fällt
  const me=arStats(),end=Math.min(r.t_me,r.t_op),scale=Math.min(10,Math.max(5,end))/end;
  ar.fight={o,r,t:0,dur:end*scale,meT:r.t_me*scale,opT:r.t_op*scale,mhp:me.hp,ohp:(r.opp&&r.opp.hp)||o.stats.hp,sp:[],fl:[],thr:0,othr:.3,done:false};
  renderArena();let last=performance.now();
  const step=now=>{const F=ar.fight;if(!F)return;const dt=Math.min(.05,(now-last)/1000);last=now;
    if(!F.done){F.t+=dt;F.thr-=dt;F.othr-=dt;
      if(F.thr<=0){F.thr=.35;F.sp.push({x:110,y:110,dir:1});}
      if(F.othr<=0){F.othr=.35;F.sp.push({x:250,y:110,dir:-1});}
      for(const p of F.sp){p.x+=p.dir*480*dt;if(!p.hit&&((p.dir>0&&p.x>235)||(p.dir<0&&p.x<125))){p.hit=true;
        F.fl.push({x:p.dir>0?270:90,y:70+rnd(-10,10),txt:'-'+fmt((p.dir>0?F.ohp:F.mhp)/((p.dir>0?F.meT:F.opT)/.35)),c:p.dir>0?'#fff':'#ff8a7a',t:.7});}}
      F.sp=F.sp.filter(p=>!p.hit);for(const f of F.fl){f.y-=26*dt;f.t-=dt;}F.fl=F.fl.filter(f=>f.t>0);
      if(F.t>=F.dur){F.done=true;F.t=F.dur;F.endT=0;}}
    else F.endT+=dt;
    drawArena();

    if(ar.open)requestAnimationFrame(step);};
  requestAnimationFrame(step);}

  drawCactus(g,F.o.card&&F.o.card.char||DEFAULT_CH,{x:0,y:150,bob:Math.sin(t*4+1),gear:(F.o.card&&F.o.card.gear)||{}});g.restore();
  bar2(60,40,60,mp,'#63c74d');bar2(240,40,60,op,'#e0283a');

  g.strokeStyle='#fff6d8';g.lineWidth=2;for(const p of F.sp){g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x+p.dir*7,p.y);g.stroke();}
  g.font='800 11px Nunito, system-ui, sans-serif';for(const f of F.fl){g.globalAlpha=Math.min(1,f.t*2);g.fillStyle='#1c120c';g.fillText(f.txt,f.x+1,f.y+1);g.fillStyle=f.c;g.fillText(f.txt,f.x,f.y);}g.globalAlpha=1;

// ---------- Offline-Fortschritt (wie offlineGain in Scrap Star) ----------
// Pro 3 Sekunden Abwesenheit zählt ein Kill, höchstens 8 Stunden. Der Boss wird offline nicht bekämpft.
const OFFLINE_CAP=8*3600,OFF_EFF=0.6;

function offlineGain(sec){
  sec=Math.min(OFFLINE_CAP,sec);if(sec<60||!S.char)return;
  const kills=Math.floor(sec/3),coinPer=Math.ceil(3*cPow(S.stage));
  const coins=Math.round(kills*coinPer*OFF_EFF*coinMul()),caps=Math.floor(kills*0.05);

  offPending={sec,kills,coins,caps,prog};
  if($('modal').hidden)showOffline();
}
function showOffline(){

  $('card').innerHTML=`<h2>Willkommen zurück!</h2>

    </div>

    <div class="row"><button class="btn go" id="offOk" type="button">Einsammeln</button></div>`;
  editing=false;draft=ch;offShow=true;$('modal').hidden=false;
  $('offOk').onclick=()=>{S.coins+=o.coins;S.caps+=o.caps;S.tk=(S.tk||0)+o.kills;S.kills=Math.min(KILL_GOAL-1,S.kills+o.prog);
    offPending=null;offShow=false;$('modal').hidden=true;save();lastHud='';banner={txt:'+'+fmt(o.coins)+' Münzen',t:1.8};};
  $('offOk').focus();
}

const DAILY=[

const dailyCoins=n=>Math.round(3*cPow(Math.max(1,S.best||1))*n);

function dailyState(){const D=S.daily||{},today=todayStr(),y=new Date();y.setDate(y.getDate()-1);
  if(D.last===today)return{ready:false,day:D.day,today};
  const next=D.last===ymd(y)?(D.day%7)+1:1;return{ready:true,day:next,today,broke:!!D.last&&D.last!==ymd(y)};}
const dailyTxt=R=>[R.caps?R.caps+' Kapseln':'',R.coins?fmt(dailyCoins(R.coins))+' Münzen':'',R.kak?R.kak+' 🌵':'',R.item?'Teil +1 Seltenheit':''].filter(Boolean).join(' · ');

    <div class="dgrid">${DAILY.map((R,i)=>{const d=i+1,done=st.ready?d<cur:d<=cur,now=st.ready&&d===cur;

        <span class="dico">${R.item?'🎁':R.kak&&!R.caps?'🌵':R.coins?'🪙':'🌱'}</span><b>${dailyTxt(R)}</b>${done?'<i>✓</i>':''}</div>`;}).join('')}</div>

    <div class="row">${st.ready?`<button class="btn" id="dlLater" type="button">Später</button><button class="btn go" id="dlGo" type="button">Tag ${cur} abholen</button>`

  $('dlLater').onclick=()=>{$('modal').hidden=true;lastHud='';};
  const g=$('dlGo');if(g)g.onclick=()=>{const s2=dailyState();if(!s2.ready)return;const R=DAILY[s2.day-1];let t2='';
    if(R.caps)S.caps+=R.caps;if(R.kak)S.kak=(S.kak||0)+R.kak;if(R.coins)S.coins+=dailyCoins(R.coins);
    if(R.item){const it=twRoll(Math.max(1,Math.floor((S.best||1)/3)),1);t2=' · '+twGive(it);}

const tut={on:false,i:0,wait:false,box:null};
function tutVisible(e){if(!e||e.hidden)return false;const r=e.getBoundingClientRect();return r.width>4&&r.height>4&&getComputedStyle(e).visibility!=='hidden';}
function tutStart(){if(tut.on)return;tut.on=true;tut.i=0;tut.wait=false;
  const b=document.createElement('div');b.className='tut';b.id='tut';
  b.innerHTML='<div class="tblk"></div><div class="tblk"></div><div class="tblk"></div><div class="tblk"></div><div class="tspot none"></div><div class="tbub"></div>';

function tutEnd(skipped){if(!tut.on)return;tut.on=false;if(tut.box)tut.box.remove();tut.box=null;S.tut2=1;

function tutNext(){tut.i++;while(tut.i<TUT.length&&TUT[tut.i].el&&!tutVisible($(TUT[tut.i].el)))tut.i++;
  if(tut.i>=TUT.length){tutEnd(false);return;}tutShow();}
function tutShow(){const st=TUT[tut.i],b=tut.box;if(!b)return;
  if(st.act==='cap'&&S.caps<1){S.caps=1;lastHud='';}
  const n=(S.char&&S.char.name)||'Kaktus',total=TUT.length;
  b.querySelector('.tbub').innerHTML=`<div class="tava">🌵</div><div class="ttx"><b class="tn">Opa Stachel</b><p>${st.t.replace('{name}',n)}</p>

    ${st.act?'':`<button class="tnext" type="button">${st.last?'Los geht’s!':'Weiter ›'}</button>`}</div></div>`;
  const nx=b.querySelector('.tnext');if(nx)nx.onclick=e=>{e.stopPropagation();tutNext();};
  const sk=b.querySelector('.tskip');if(sk)sk.onclick=e=>{e.stopPropagation();tutEnd(true);};

function tutPlace(){const b=tut.box;if(!b)return;const st=TUT[tut.i],sp=b.querySelector('.tspot'),bub=b.querySelector('.tbub'),bl=b.querySelectorAll('.tblk');
  const W=innerWidth,H=innerHeight,e=st.el?$(st.el):null;
  // während eine Kapsel aufgeht (Fenster offen), tritt die Einführung zur Seite
  const hide=!$('modal').hidden;b.style.display=hide?'none':'';if(hide)return;
  if(!e){sp.className='tspot none';sp.style.cssText='';bl[0].style.cssText='left:0;top:0;width:100%;height:100%';for(let k=1;k<4;k++)bl[k].style.cssText='display:none';
    bub.style.top=Math.max(16,H/2-bub.offsetHeight/2)+'px';return;}
  const r=e.getBoundingClientRect(),pad=6;let x=r.left-pad,y=r.top-pad,w=r.width+2*pad,h=r.height+2*pad;
  if(y<4){h+=y-4;y=4;}if(y+h>H-4)h=H-4-y;
  // nicht unter die feste Leiste unten (Werkstatt, Hunde, Gärtnerei) ragen
  {const A=document.querySelector('.actions');if(A&&!A.contains(e)){const at=A.getBoundingClientRect().top;if(y+h>at-4)h=Math.max(30,at-4-y);}}
  sp.className='tspot'+(st.act?' pulse':'');sp.style.left=x+'px';sp.style.top=y+'px';sp.style.width=w+'px';sp.style.height=h+'px';
  // Klicks nur auf das Ziel durchlassen, wenn der Spieler es antippen soll; sonst alles blockieren
  if(st.act){bl[0].style.cssText=`left:0;top:0;width:100%;height:${y}px`;bl[1].style.cssText=`left:0;top:${y+h}px;width:100%;height:${Math.max(0,H-y-h)}px`;
    bl[2].style.cssText=`left:0;top:${y}px;width:${x}px;height:${h}px`;bl[3].style.cssText=`left:${x+w}px;top:${y}px;width:${Math.max(0,W-x-w)}px;height:${h}px`;}
  else{bl[0].style.cssText='left:0;top:0;width:100%;height:100%';for(let k=1;k<4;k++)bl[k].style.cssText='display:none';}
  // Sprechblase dorthin, wo mehr Platz ist
  const bh=bub.offsetHeight,below=H-(y+h),above=y;
  let top=below>=above?y+h+12:y-bh-12;top=Math.max(8,Math.min(H-bh-8,top));bub.style.top=top+'px';}

{const today=(()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})();
 const isNewPlayer=!oldSave;let done=false;
 const tm=setInterval(()=>{if(done){clearInterval(tm);return;}if(!S.char||editing||!$('modal').hidden)return;
  // ganz neue Spieler: alte Einträge gelten als gesehen, aber die Änderungen von heute zeigen wir trotzdem nicht (sie kennen das Spiel ja noch nicht)
  const list=isNewPlayer?[]:PATCHES.filter(p=>p.date===today||!S[p.id]);
  done=true;clearInterval(tm);if(!list.length)return;
  const L=(t,x)=>`<li><b>${t}</b> ${x}</li>`,dd=list[list.length-1].date.split('-').reverse().join('.');
  const ws=list.some(p=>p.ws);
  $('card').innerHTML=`<h2>Patch Notes <span style="color:var(--sand)">${list.every(p=>p.date===today)?'heute':dd}</span></h2>
    <div class="pnlist">${list.slice().reverse().map(P=>`<section class="pnsec"><h3>${P.title}${S[P.id]?'':' <em class="pnnew">neu</em>'}</h3>
      <div class="pnhero"><b>${P.hero[0]}</b><span>${P.hero[1]}</span></div>
      <ul class="pn">${P.items().map(([a,b])=>L(a,b)).join('')}</ul></section>`).join('')}</div>
    <div class="row"><button class="btn${ws?'':' go'}" id="pnOk" type="button">${ws?'Schließen':'Alles klar'}</button>${ws?'<button class="btn go" id="pnWs" type="button">Zur Werkstatt</button>':''}</div>`;
  $('modal').hidden=false;
  const seen=()=>{for(const P of list)S[P.id]=true;delete S.v9back;save();};
  $('pnOk').onclick=()=>{seen();$('modal').hidden=true;lastHud='';};
  if($('pnWs'))$('pnWs').onclick=()=>{seen();hqOpen=true;lastHud='';renderWS();};},800);}

// ---------- ×2-Tempo: wird für 30 Minuten durch ein Werbevideo freigeschaltet (zurzeit ein Platzhalter mit 5-s-Countdown) ----------
const X2_MIN=30;
const x2Active=()=>(S.x2Until||0)>Date.now();
function renderX2(){const b=$('x2Btn');if(!b)return;const act=x2Active(),on=act&&S.x2On!==false;
  b.setAttribute('aria-pressed',on);b.classList.toggle('locked',!act);
  const left=Math.max(0,((S.x2Until||0)-Date.now())/1000);
  $('x2Sub').textContent=act?(on?'':'aus · ')+Math.floor(left/60)+':'+String(Math.floor(left%60)).padStart(2,'0'):'▶ Video';
  b.title=act?'Doppeltes Kampftempo '+(on?'an':'aus')+' (antippen zum Umschalten)':'Video ansehen: 30 Minuten doppeltes Kampftempo';}
setInterval(renderX2,1000);renderX2();
function showAd(onDone){
  let n=5;
  $('card').innerHTML=`<h2>Werbung</h2><div class="adbox"><span>Hier läuft später ein Werbevideo</span><b id="adN">${n}</b></div>
    <p class="hint" style="margin:0">Danach hast du ${X2_MIN} Minuten doppeltes Kampftempo.</p>
    <div class="row"><button class="btn" id="adX" type="button">Abbrechen</button><button class="btn go" id="adOk" type="button" disabled>Belohnung holen</button></div>`;
  $('modal').hidden=false;
  const tm=setInterval(()=>{n--;const el=$('adN');if(el)el.textContent=Math.max(0,n);
    if(n<=0){clearInterval(tm);const ok=$('adOk');if(ok){ok.disabled=false;ok.focus();}const box=document.querySelector('.adbox');if(box)box.classList.add('done');}},1000);
  $('adX').onclick=()=>{clearInterval(tm);$('modal').hidden=true;lastHud='';};
  $('adOk').onclick=()=>{clearInterval(tm);$('modal').hidden=true;lastHud='';onDone();};
}
$('x2Btn').onclick=()=>{if(!$('modal').hidden||editing)return;
  if(x2Active()){S.x2On=S.x2On===false;save();renderX2();banner={txt:S.x2On?'Doppeltes Tempo an':'Normales Tempo',t:1.2};return;}
  showAd(()=>{S.x2Until=Date.now()+X2_MIN*60000;S.x2On=true;save();renderX2();banner={txt:'×2 Tempo für '+X2_MIN+' Minuten!',t:2};});};

// ---------- Schleife ----------
let last=performance.now();
function gameStep(dt){
  if(editing||offShow){t+=dt;drawPreview();}
  else if(maint.on&&!maint.dev){t+=dt;}
  else{gardenTick();autoTick(dt);const sp=x2Active()&&S.x2On!==false?2:1;for(let k=0;k<sp;k++)update(dt);}
}
// Energiesparmodus: das Spiel läuft genauso weiter, wird aber nur ~20-mal pro Sekunde in halber Auflösung gezeichnet,
// mit weniger Partikeln, ohne Wackeln, und die Figur in der Ausrüstung nur 4-mal pro Sekunde
let dollAcc=0;
function loop(now){
  const raw=Math.min(0.25,Math.max(0,(now-last)/1000));last=now;
  if(eco){let r=raw;while(r>1e-4){const d=Math.min(0.05,r);gameStep(d);r-=d;}
    draw();hud();dollAcc+=raw;if(dollAcc>=0.25){dollAcc=0;if(eqOpen)drawEqHero();else drawDoll();}
    setTimeout(()=>requestAnimationFrame(loop),ECO_MS);}
  else{gameStep(Math.min(0.05,raw));draw();hud();if(eqOpen)drawEqHero();else drawDoll();requestAnimationFrame(loop);}
}
requestAnimationFrame(loop);
setInterval(save,5000);
})();
